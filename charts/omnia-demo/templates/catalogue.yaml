{{- if .Values.catalogue.enabled }}
{{- $ns := .Values.namespace }}
{{- $c := .Values.catalogue }}
{{- $path := trimSuffix "/" $c.path }}
# A static page describing every demo tenant and its demos, served at
# <dashboard host><catalogue.path>/ behind the dashboard's own sign-in: the
# browser sends the dashboard's session cookie to every path on that host, so
# nginx asks management-api (GET /api/v1/auth/me) whether the cookie is a
# signed-in session and sends anyone else to the dashboard login. No DNS,
# certificate or credentials of its own.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-catalogue
  namespace: {{ $ns }}
data:
  index.html: |
{{ .Files.Get "files/catalogue/index.html" | indent 4 }}
  default.conf: |
    # WebSocket upgrades through the proxied sites (catalogue.proxies).
    map $http_upgrade $omnia_connection_upgrade {
      default upgrade;
      ''      close;
    }
    server {
      listen 8080;
      server_tokens off;
      # Relative redirects: behind the Gateway, nginx's own scheme and port
      # (http, 8080) are not the ones the browser used.
      absolute_redirect off;
      location = /healthz { access_log off; return 200 "ok\n"; }
      location = {{ $path }} { return 302 {{ $path }}/; }
      location {{ $path }}/ {
        {{- if $c.authURL }}
        auth_request /_omnia_auth;
        error_page 401 403 = @omnia_login;
        {{- end }}
        alias /usr/share/nginx/html/;
        index index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
      }
      {{- range $i, $p := $c.proxies }}
      {{- $pp := trimSuffix "/" $p.path }}
      # {{ $pp }}/ -> {{ $p.upstream }}, behind the same sign-in. Absolute paths
      # the site uses are rewritten under the prefix (rewrites), and its
      # redirects and WebSocket upgrades pass through.
      location = {{ $pp }} { return 302 {{ $pp }}/; }
      location {{ $pp }}/ {
        {{- if $c.authURL }}
        auth_request /_omnia_auth;
        error_page 401 403 = @omnia_login_{{ $i }};
        {{- end }}
        proxy_pass {{ trimSuffix "/" $p.upstream }}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $omnia_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_redirect / {{ $pp }}/;
        {{- with $p.rewrites }}
        # sub_filter needs the response uncompressed.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types *;
        {{- range . }}
        sub_filter {{ .from | squote }} {{ .to | squote }};
        {{- end }}
        {{- end }}
      }
      {{- if $c.authURL }}
      location @omnia_login_{{ $i }} {
        return 302 {{ $c.loginPath }}?returnTo={{ $pp }}/;
      }
      {{- end }}
      {{- end }}
      {{- if $c.authURL }}
      # The dashboard's session check, with the caller's cookie and nothing
      # else. A 2xx serves the page; a 401 goes to the login.
      location = /_omnia_auth {
        internal;
        proxy_pass {{ trimSuffix "/" $c.authURL }}/api/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
      }
      location @omnia_login {
        return 302 {{ $c.loginPath }}?returnTo={{ $path }}/;
      }
      {{- end }}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-catalogue
  namespace: {{ $ns }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: demo-catalogue }
  template:
    metadata:
      labels: { app.kubernetes.io/name: demo-catalogue }
      annotations:
        checksum/content: {{ printf "%s%s" (.Files.Get "files/catalogue/index.html") (toJson $c) | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: {{ $c.image }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: content, mountPath: /usr/share/nginx/html/index.html, subPath: index.html, readOnly: true }
            - { name: content, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: content
          configMap: { name: demo-catalogue }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-catalogue
  namespace: {{ $ns }}
spec:
  selector: { app.kubernetes.io/name: demo-catalogue }
  ports: [{ name: http, port: 8080, targetPort: http }]
{{- if $c.route.enabled }}
---
# More specific than the dashboard's own "/" route on the same host, so this
# path reaches the catalogue and everything else still reaches the dashboard.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-catalogue
  namespace: {{ $ns }}
spec:
  parentRefs:
    {{- required "catalogue.route.parentRefs is required (the dashboard's Gateway)" $c.route.parentRefs | toYaml | nindent 4 }}
  hostnames:
    {{- required "catalogue.route.hostnames is required (the dashboard's host)" $c.route.hostnames | toYaml | nindent 4 }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: {{ $path }} }
      backendRefs:
        - { name: demo-catalogue, port: 8080 }
    {{- range $c.proxies }}
    - matches:
        - path: { type: PathPrefix, value: {{ trimSuffix "/" .path }} }
      backendRefs:
        - { name: demo-catalogue, port: 8080 }
    {{- end }}
{{- end }}
{{- end }}

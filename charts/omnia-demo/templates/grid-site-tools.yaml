{{- if .Values.gridSite.enabled }}
{{- $g := .Values.gridSite }}
{{- $limit := int (default 25000 $g.workOrderLimitGBP) }}
---
# THE TOOLS: what the site runs, declared in Omnia.
#
# The site's tools run on site, never in the cluster, so each one is a
# `remote` handler: metadata only, with no endpoint. Omnia runs a tool the site
# runs itself only if a registry the agent references declares it, and
# decides it under that registry, whatever name the site sends. The schemas
# are the pack's (files/arena/grid-site-agent-pack.json); the relay logs any
# difference. remote.agents offers them to the site's agent only.
apiVersion: omnia.altairalabs.ai/v1alpha1
kind: ToolRegistry
metadata:
  name: grid-site-tools
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
spec:
  handlers:
    - name: site-assets
      type: remote
      tool:
        name: list_assets
        description: "List every asset at the Wrenmoor Edge wind farm and its 33 kV collector substation, with its id, what it is, its state, and any active alarm. Read from the site SCADA."
        inputSchema: {"properties": {}, "type": "object"}
      remote:
        agents: [grid-site-agent]
    - name: site-scada
      type: remote
      tool:
        name: read_scada
        description: "Read one asset's live values from the site SCADA: its state, any active alarm, and each measured point with its unit. Read-only; it never operates plant."
        inputSchema: {"properties": {"asset_id": {"description": "The asset id, e.g. WE-T07 (a turbine) or WE-GT1 (the grid transformer)", "type": "string"}}, "required": ["asset_id"], "type": "object"}
      remote:
        agents: [grid-site-agent]
    - name: site-work-orders
      type: remote
      tool:
        name: raise_work_order
        description: "Raise a maintenance work order in the site's maintenance system against one asset. The order is released to the maintenance contractor as soon as it is raised, and the estimated cost is committed against the site's maintenance budget."
        inputSchema: {"properties": {"asset_id": {"description": "The asset the work is on, e.g. WE-T07", "type": "string"}, "estimated_cost_gbp": {"description": "The estimated cost of the work, in whole pounds sterling", "type": "integer"}, "priority": {"description": "How soon the work is needed", "enum": ["routine", "urgent", "emergency"], "type": "string"}, "summary": {"description": "One line describing the work, e.g. \"Replace blade B pitch motor\"", "type": "string"}}, "required": ["asset_id", "priority", "summary", "estimated_cost_gbp"], "type": "object"}
      remote:
        agents: [grid-site-agent]
---
# THE CONTROL: a work order above the site's delegated limit needs a human.
#
# The site's tools run at the site, and before each one runs the site asks
# Omnia over the dial-home channel. The relay in the agent's pod asks the
# policy broker beside it, as an in-cluster runtime does, for the engineer
# the console sent with the conversation, and the site runs the tool only on
# an allow. A £48,000 order is refused here, before it is raised, and the
# refusal is recorded on the session as denied.
#
# The site's tools are declared in the grid-site-tools ToolRegistry (this file),
# and this policy selects and permits them by it.
#
# The condition is the money, not the tool's name, for the reason the claims
# demo gives: a name match governs one tool and misses the next one that
# commits spend. Whole pounds, never a float.
apiVersion: omnia.altairalabs.ai/v1alpha1
kind: ToolPolicy
metadata:
  name: grid-site-policy
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
spec:
  selector:
    registry: grid-site-tools
  mode: enforce
  onFailure: deny
  producers:
    - name: aboveSiteLimit
      type: cel
      cel: has(body.estimated_cost_gbp) && body.estimated_cost_gbp > {{ $limit }}
  policy: |
    // The site's tools are permitted. Cedar is default-deny, so without this
    // grant nothing runs, not even a SCADA read.
    @id("permit-site-tools")
    permit (principal, action == Action::"invoke",
            resource in Registry::"grid-site-tools");

    // Wrenmoor Energy delegated authority WE-MNT-03.
    @id("deny-work-order-above-site-limit")
    @message("This work order is above the £{{ $limit }} the site assistant may commit without a human, so it was not raised. Ask the control engineer to raise it, and do not split it into smaller orders to bring each under the limit. (Wrenmoor Energy delegated authority WE-MNT-03.)")
    forbid (principal, action == Action::"invoke", resource)
    when { context.aboveSiteLimit };
{{- end }}

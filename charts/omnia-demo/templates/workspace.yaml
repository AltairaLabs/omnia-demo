{{- if .Values.workspace.create }}
{{- $name := include "omnia-demo.workspaceName" . }}
# The demo tenant's Workspace. Install the release into the workspace namespace
# with --create-namespace: Helm owns the namespace, and the operator adopts it
# (namespace.create: false), so the chart's other resources never race the
# operator's reconcile.
apiVersion: omnia.altairalabs.ai/v1alpha1
kind: Workspace
metadata:
  name: {{ $name }}
spec:
  displayName: {{ default $name .Values.workspace.displayName | quote }}
  {{- with .Values.workspace.description }}
  description: {{ . | quote }}
  {{- end }}
  environment: {{ .Values.workspace.environment }}
  namespace:
    name: {{ .Values.namespace }}
    create: false
    {{- with .Values.workspace.namespaceLabels }}
    labels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  roleBindings:
    {{- toYaml .Values.workspace.roleBindings | nindent 4 }}
  {{- $rsa := .Values.workspace.runtimeServiceAccount }}
  {{- $rid := .Values.workspace.runtimeIdentity }}
  {{- if or $rsa.name $rid.serviceAccountAnnotations $rid.podLabels }}
  # Workload identity for every agent in the workspace, including ones
  # deployed through the API with no pod overrides.
  # - Omnia >= 0.9.0-beta.23 runs each agent as its own <agent>-facade
  #   ServiceAccount (Omnia #3624): runtimeIdentity.serviceAccountAnnotations
  #   are set on each of them, and the cloud side federates one credential
  #   per agent.
  # - runtimeServiceAccount names a template SA instead: before beta.23 the
  #   agents ran as it; from beta.23 its annotations are copied onto theirs.
  runtime:
    {{- with $rsa.name }}
    serviceAccountName: {{ . }}
    {{- end }}
    {{- with $rid.serviceAccountAnnotations }}
    serviceAccountAnnotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with (merge (dict) ($rid.podLabels | default dict) ($rsa.podLabels | default dict)) }}
    podLabels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- with .Values.workspace.services }}
  services:
    {{- /* With the Galaxy on, every memory service takes its MemoryPolicy
           unless the values already name one. */}}
    {{- $services := list }}
    {{- range . }}
    {{- $s := deepCopy . }}
    {{- if and $.Values.galaxy.enabled $s.memory (not $s.memory.policyRef) }}
    {{- $_ := set $s.memory "policyRef" (dict "name" (include "omnia-demo.galaxyPolicyName" $)) }}
    {{- end }}
    {{- /* The card-support canary needs the eval worker, which a pack with no
           evals of its own (card support 1.0.0) does not bring up. It runs as
           the canary's ServiceAccount, with workload identity for the judge. */}}
    {{- if and $.Values.piiChat.enabled $.Values.piiChat.canary.enabled (eq $s.name $.Values.workspace.serviceGroup) (not $s.evalWorker) }}
    {{- $_ := set $s "evalWorker" (dict "enabled" true "podOverrides" (dict "serviceAccountName" $.Values.piiChat.canary.evalWorkerServiceAccount "labels" ($.Values.workspace.runtimeIdentity.podLabels | default dict))) }}
    {{- end }}
    {{- /* Dreaming on the demo's service group (values: dreaming). */}}
    {{- $d := $.Values.dreaming }}
    {{- if and $d.enabled (eq $s.name $.Values.workspace.serviceGroup) (not $s.dreaming) }}
    {{- $sel := dict "mode" $d.selection.mode "maxSessions" $d.selection.maxSessions "lookback" $d.selection.lookback "minTurns" $d.selection.minTurns }}
    {{- with $d.selection.agents }}{{ $_ := set $sel "agents" . }}{{ end }}
    {{- $dr := dict "enabled" true "schedule" $d.schedule "selection" $sel "providerRef" (dict "name" (required "dreaming.providerRef or llm.providerRef" (default $.Values.llm.providerRef $d.providerRef))) }}
    {{- with $d.envelope.name }}{{ $_ := set $dr "envelopeRef" (dict "name" .) }}{{ end }}
    {{- $_ := set $s "dreaming" $dr }}
    {{- end }}
    {{- /* Claims triage holds an over-limit settlement for a claims handler
           (values: claimsTriage.referral): the group needs its referral-api. */}}
    {{- if and $.Values.claimsTriage.enabled $.Values.claimsTriage.referral.enabled (eq $s.name $.Values.workspace.serviceGroup) (not $s.referral) }}
    {{- $_ := set $s "referral" (dict) }}
    {{- end }}
    {{- $services = append $services $s }}
    {{- end }}
    {{- toYaml $services | nindent 4 }}
  {{- end }}
  {{- with .Values.workspace.storage }}
  storage:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.workspace.privacy }}
  privacy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- $md := .Values.piiChat.portal.myData }}
  {{- if and .Values.piiChat.enabled .Values.piiChat.portal.enabled $md.enabled }}
  # The end-user plane (management-api /api/v1/me/workspaces/<name>): members
  # reach their own consent, memories and erasure with a token from the member
  # portal, the demo's stand-in identity provider (docs/stand-ins.md). The
  # audience is the plane's own, never an agent's.
  endUserAuth:
    oidc:
      issuer: {{ include "omnia-demo.issuerURL" (dict "service" "larkmere-portal" "root" .) | quote }}
      audience: {{ required "piiChat.portal.myData.audience" $md.audience | quote }}
  {{- end }}
  {{- if .Values.poppy.enabled }}
  # A Poppy Company (Personal Agent Protocol). Omnia builds the Company's
  # poppy.json from it and the agents that join it; poppy-routes.yaml serves it.
  poppy:
    companies:
      - name: default
        organization:
          name: {{ default $name .Values.workspace.displayName | quote }}
          domain: {{ required "poppy.domain" .Values.poppy.domain | quote }}
        personalAgents:
          allow:
            {{- toYaml (required "poppy.allow" .Values.poppy.allow) | nindent 12 }}
        {{- $auth := .Values.poppy.auth }}
        {{- if $auth.enabled }}
        {{- /* Omnia requires scopes and scopeHints to have the same keys. */}}
        {{- if ne (keys ($auth.scopes | default dict) | sortAlpha | join ",") (keys ($auth.scopeHints | default dict) | sortAlpha | join ",") }}
        {{- fail "poppy.auth.scopes and poppy.auth.scopeHints must have the same keys" }}
        {{- end }}
        # Company sign-in (PAP §3.2): the issuer a Personal Agent signs Ellen in
        # at, the scopes it may ask for, and how the facades read the access
        # tokens it issues. The account tools (poppy-account-tools.yaml) need
        # it.
        auth:
          {{- if $auth.gateway.enabled }}
          # Omnia's Poppy issuer gateway in front of the Company's own OIDC
          # provider, as Omnia #4443 proposes it. THIS FIELD DOES NOT EXIST
          # until #4443 ships, and the API server refuses a Workspace that sets
          # it: keep poppy.auth.gateway.enabled off until then. The operator
          # sets the issuer to the gateway's URL.
          gateway:
            upstream:
              issuer: {{ required "poppy.auth.gateway.upstream.issuer" $auth.gateway.upstream.issuer | quote }}
              clientID: {{ required "poppy.auth.gateway.upstream.clientID" $auth.gateway.upstream.clientID | quote }}
              clientSecretRef:
                name: {{ required "poppy.auth.gateway.upstream.clientSecretRef" $auth.gateway.upstream.clientSecretRef }}
            host: {{ required "poppy.auth.gateway.host" $auth.gateway.host | quote }}
          {{- else }}
          issuer: {{ required "poppy.auth.issuer (or poppy.auth.gateway.enabled)" $auth.issuer | quote }}
          {{- end }}
          scopes:
            {{- toYaml (required "poppy.auth.scopes" $auth.scopes) | nindent 12 }}
          scopeHints:
            {{- toYaml (required "poppy.auth.scopeHints" $auth.scopeHints) | nindent 12 }}
          accessTokens:
            {{- /* Omitted when empty, so Omnia's default applies:
                 https://<organization.domain>. An empty list would be refused
                 (1-8 entries). */}}
            {{- with $auth.accessTokens.audiences }}
            audiences:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            clientIDClaim: {{ $auth.accessTokens.clientIDClaim }}
            scopeClaim: {{ $auth.accessTokens.scopeClaim }}
        {{- end }}
  {{- end }}
  {{- with .Values.workspace.costControls }}
  costControls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if and .Values.workspace.runtimeServiceAccount.name .Values.workspace.runtimeServiceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workspace.runtimeServiceAccount.name }}
  namespace: {{ .Values.namespace }}
  {{- with .Values.workspace.runtimeServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}

{{- if and .Values.memory.enabled .Values.memory.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-s3
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: memory-s3 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: memory-s3 }
    spec:
      containers:
        - name: minio
          image: {{ .Values.memory.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.memory.minio.accessKey | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.memory.minio.secretKey | quote }}
          ports:
            - { name: api, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: api }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: memory-s3
  namespace: {{ .Values.namespace }}
spec:
  selector: { app.kubernetes.io/name: memory-s3 }
  ports:
    - { name: api, port: 9000, targetPort: api }
    - { name: console, port: 9001, targetPort: console }
{{- end }}

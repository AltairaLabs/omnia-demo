{{- if .Values.halvernSite.enabled }}
{{- $ns := .Values.namespace }}
---
# Halvern Partners' websites: the public site, the Practice Desk (the internal
# view of client engagements and the agents deployed at each client) and the
# design-system reference. The demo-sites binary (demos/demo-sites) with
# --site halvern-partners, the same image as every other brand's site.
#
# Serve it through the catalogue's proxy (catalogue.proxies) at
# /halvern-partners. Every URL the site uses is relative, so it needs no
# rewrites. No page talks to an agent yet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: halvern-site
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
    app.kubernetes.io/component: customer-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: halvern-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: halvern-site
        app.kubernetes.io/part-of: {{ .Chart.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        # Numeric, because runAsNonRoot alone cannot be verified against a
        # distroless image whose USER is the NAME "nonroot".
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: site
          image: {{ include "omnia-demo.image" (dict "root" $ "image" .Values.halvernSite.image) }}
          imagePullPolicy: {{ .Values.halvernSite.image.pullPolicy }}
          args:
            - --site
            - halvern-partners
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: halvern-site
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
spec:
  selector:
    app.kubernetes.io/name: halvern-site
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}

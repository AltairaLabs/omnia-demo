{{- if .Values.dreaming.enabled }}
# Dreaming's orchestrator calls its seven tools through the policy broker,
# which is default-deny, and Dreaming provisions its ToolRegistry
# (dreaming-<group>-tools) without a ToolPolicy. With no permit, every call
# is refused (deniedBy=no-matching-permit) and the night ends without
# studying anything (Omnia #4240). A person writes this one, like every
# other gate Dreaming runs behind.
#
# It permits the calls and decides nothing else. What a night may touch is
# decided by the tools themselves (the orchestrator's token, consent, the
# envelope's budget) and by the admission policies.
apiVersion: omnia.altairalabs.ai/v1alpha1
kind: ToolPolicy
metadata:
  name: dreaming-{{ .Values.workspace.serviceGroup }}-policy
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    registry: dreaming-{{ .Values.workspace.serviceGroup }}-tools
  policy: |
    @id("permit-dreaming-tools")
    permit (principal, action == Action::"invoke", resource);
  mode: enforce
  onFailure: deny
{{- end }}

{{- if .Values.piiChat.enabled }}
{{- $ns := .Values.namespace }}
---
# The member assistant's card system (demos/mortgage-underwriting/cards.go):
# look up, freeze and unfreeze the signed-in member's card.
#
# No tool takes an argument that names the member. The runtime sends the
# verified member's email on every tool call (X-Omnia-User-Email), and the card
# system acts on that member's card only, so nothing the model writes can point
# a tool at someone else's account.
#
# The description and schemas here are NOT what the model reads: PromptKit
# builds its tool descriptors from the PACK, so the tool as the LLM sees it is
# demos/pii-chat/arena/tools/<tool>.tool.yaml. This registry contributes the
# BINDING (the http handler) and the identity the ToolPolicy selects on. They
# are kept in step anyway: a drifted schema here breaks dispatch while the model
# carries on believing the pack's version. Change both.
apiVersion: omnia.altairalabs.ai/v1alpha1
kind: ToolRegistry
metadata:
  name: pii-chat-tools
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
spec:
  handlers:
    {{- range $t := list
          (dict "name" "get_card_status" "path" "card-status" "desc" "Look up the member's card: their name, the card's last four digits and its status (active or frozen).")
          (dict "name" "freeze_card" "path" "card-freeze" "desc" "Freeze the member's card so no new payments go through, for example when it is lost or stolen. Returns the card's last four digits and new status; changed is false if it was already frozen.")
          (dict "name" "unfreeze_card" "path" "card-unfreeze" "desc" "Unfreeze the member's card so it works again, for example when they have found it. Returns the card's last four digits and new status; changed is false if it was not frozen.") }}
    - name: {{ replace "_" "-" $t.name }}-handler
      type: http
      timeout: 30s
      tool:
        name: {{ $t.name }}
        description: {{ $t.desc | quote }}
        inputSchema:
          type: object
          properties: {}
        outputSchema:
          type: object
          properties:
            full_name: { type: string }
            card_last4:
              type: string
              description: "The last four digits only. The full card number is never returned by this service."
            card_status: { type: string }
            changed: { type: boolean }
      httpConfig:
        endpoint: http://pii-chat-identity.{{ $ns }}:8080/{{ $t.path }}
        method: POST
        contentType: application/json
    {{- end }}
---
# Without this the demo does not run at all.
#
# The operator injects a policy-broker sidecar into every agent pod when
# enterprise is on, Cedar is default-deny, and the broker denies any call that
# no ToolPolicy selects — `deniedBy: no-matching-permit`, "no ToolPolicy
# permits this call". So an agent with a ToolRegistry and no ToolPolicy gets
# every tool refused, and quietly: server tools are never forwarded over the
# WebSocket, so it looks like a model that chose not to call anything. Read
# the sidecar, not the agent, when a tool silently does nothing.
#
# The selector covers the WHOLE registry. Naming a subset denies the rest with
# the same no-matching-permit (see the note on the mortgage policy).
apiVersion: omnia.altairalabs.ai/v1alpha1
kind: ToolPolicy
metadata:
  name: pii-chat-policy
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
spec:
  selector:
    registry: pii-chat-tools
  mode: enforce
  onFailure: deny
  policy: |
    // The card tools are permitted. Which card they touch is the card
    // system's decision, from the verified member on the call. The mortgage
    // demo is where a ToolPolicy refuses a call on its payload; keep the two
    // demos making one point each.
    @id("permit-card-tools")
    permit (principal, action == Action::"invoke", resource);
{{- end }}

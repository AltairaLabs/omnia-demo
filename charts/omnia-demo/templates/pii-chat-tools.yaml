{{- if .Values.piiChat.enabled }}
{{- $ns := .Values.namespace }}
---
# One tool, and it needs the SSN.
#
# That is the design, not an oversight. The demo's claim is that a sensitive
# value is redacted everywhere it comes to rest, and session-api redacts
# `content` on /messages and `arguments` on /tool-calls through the same policy
# but by different code paths. A tool that took only a customer reference would
# prove half of it.
#
# Both arguments are required, so the model cannot satisfy the call with the
# SSN alone and leave the DOB in conversation — the backend enforces it too
# (demos/mortgage-underwriting/server.go, verifyIdentity).
apiVersion: omnia.altairalabs.ai/v1alpha1
kind: ToolRegistry
metadata:
  name: pii-chat-tools
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
spec:
  handlers:
    - name: verify-identity-handler
      type: http
      timeout: 30s
      # The description and schemas below are NOT what the model reads.
      #
      # PromptKit builds its descriptor registry from the PACK
      # (ToToolRepository, in the PromptKit SDK), so the tool as the LLM
      # sees it is demos/pii-chat/arena/tools/verify-identity.tool.yaml. What
      # this registry contributes is the BINDING — the http handler below — and
      # the identity the ToolPolicy selects on.
      #
      # They are kept in step anyway: a drifted schema here breaks dispatch
      # while the model carries on believing the pack's version, which is a
      # miserable failure to diagnose. Change both.
      tool:
        name: verify_identity
        description: "Confirm a cardholder's identity from their Social Security number and date of birth before discussing or acting on their account. Returns the customer reference, the cardholder's name, the last four digits of the card on file, and the card's current status."
        inputSchema:
          type: object
          properties:
            ssn:
              type: string
              description: "The cardholder's Social Security number, as they gave it, e.g. 123-45-6789."
            dob:
              type: string
              description: "The cardholder's date of birth in YYYY-MM-DD form."
          required: ["ssn", "dob"]
        outputSchema:
          type: object
          properties:
            verified: { type: boolean }
            customer_ref: { type: string }
            full_name: { type: string }
            card_last4:
              type: string
              description: "The last four digits only. The full card number is never returned by this service."
            card_status: { type: string }
      httpConfig:
        endpoint: http://pii-chat-identity.{{ $ns }}:8080/verify-identity
        method: POST
        contentType: application/json
---
# Without this the demo does not run at all.
#
# The operator injects a policy-broker sidecar into every agent pod when
# enterprise is on, Cedar is default-deny, and the broker denies any call that
# no ToolPolicy selects — `deniedBy: no-matching-permit`, "no ToolPolicy
# permits this call". So an agent with a ToolRegistry and no ToolPolicy gets
# every tool refused. Observed exactly that: verify_identity was recorded as a
# tool call, never reached the identity service, and the conversation carried
# on as though the model had simply chosen not to call anything.
#
# That failure is quiet from the outside. The stream shows no tool call (server
# tools are never forwarded over the WebSocket), the transcript looks like a
# model that did not bother, and only the broker's log names the cause. Read
# the sidecar, not the agent, when a tool silently does nothing.
#
# The selector covers the WHOLE registry, which here is one tool. Naming a
# subset denies the rest with the same no-matching-permit — see the longer note
# on the mortgage policy, where narrowing it to one tool killed the other six.
apiVersion: omnia.altairalabs.ai/v1alpha1
kind: ToolPolicy
metadata:
  name: pii-chat-policy
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
spec:
  selector:
    registry: pii-chat-tools
  mode: enforce
  onFailure: deny
  policy: |
    // The identity check is permitted. This demo's subject is redaction, not
    // egress control — the interesting question here is what the RECORD keeps,
    // not whether the call may happen. The mortgage demo is where a ToolPolicy
    // refuses a call on its payload; keep the two demos making one point each.
    @id("permit-identity-check")
    permit (principal, action == Action::"invoke", resource);
{{- end }}

{{- if .Values.dataAnalyst.enabled }}
{{- $ns := .Values.namespace }}
{{- $grid := printf "http://wrenmoor-grid-data.%s:8080" $ns }}
---
# Four reads over the generation dataset: Wrenmoor Edge, Cragg Vale Solar and
# Heptonstall Store, and the energy mix. Shared by the data-analyst function and
# its A2A twin, so one ToolPolicy covers both.
apiVersion: omnia.altairalabs.ai/v1alpha1
kind: ToolRegistry
metadata:
  name: data-analyst-tools
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
spec:
  handlers:
    - name: list-sites-handler
      type: http
      timeout: 30s
      tool:
        name: list_sites
        description: "List Wrenmoor Energy's generation sites: id, name, kind (wind, solar, battery), capacity, storage, units and export meter."
        inputSchema:
          type: object
          properties: {}
      httpConfig:
        endpoint: {{ $grid }}/grid/sites
        method: POST
        contentType: application/json

    - name: get-site-output-handler
      type: http
      timeout: 30s
      tool:
        name: get_site_output
        description: "Half-hourly output of one site for one day, with peak, energy, capacity factor and missing readings."
        inputSchema:
          type: object
          properties:
            site_id: { type: string, description: "Site id, e.g. WM-EDGE." }
            date: { type: string, description: "The day, YYYY-MM-DD." }
          required: ["site_id"]
      httpConfig:
        endpoint: {{ $grid }}/grid/output
        method: POST
        contentType: application/json

    - name: get-energy-mix-handler
      type: http
      timeout: 30s
      tool:
        name: get_energy_mix
        description: "The energy mix by source (wind, solar, battery): live in MW without a date, or a day's MWh with one."
        inputSchema:
          type: object
          properties:
            date: { type: string, description: "The day, YYYY-MM-DD; omit for the live mix." }
      httpConfig:
        endpoint: {{ $grid }}/grid/mix
        method: POST
        contentType: application/json

    - name: get-daily-summaries-handler
      type: http
      timeout: 30s
      tool:
        name: get_daily_summaries
        description: "Generation summaries for every complete day after the cursor, up to yesterday, at most seven per call, with next_cursor to carry on from."
        inputSchema:
          type: object
          properties:
            cursor: { type: string, description: "The last day already digested, YYYY-MM-DD, or empty." }
          required: ["cursor"]
      httpConfig:
        endpoint: {{ $grid }}/grid/daily-summaries
        method: POST
        contentType: application/json
---
# A read-only agent, and the policy says so. The permit grants the registry;
# the forbid refuses anything that does not declare itself a read — which
# today is nothing, and is the point: a write tool added to this registry is
# refused until someone decides this agent should have one and changes the
# policy, rather than silently inherited.
apiVersion: omnia.altairalabs.ai/v1alpha1
kind: ToolPolicy
metadata:
  name: data-analyst-policy
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
spec:
  selector:
    registry: data-analyst-tools
  mode: enforce
  onFailure: deny
  producers:
    - name: notADeclaredRead
      type: cel
      cel: '!tool.declared || tool.effect != "read"'
  policy: |
    @id("permit-grid-reads")
    permit (principal, action == Action::"invoke",
            resource in Registry::"data-analyst-tools");

    @id("deny-anything-but-reads")
    @message("The grid data analyst only reads. This tool does not declare itself a read, so the analyst may not call it.")
    forbid (principal, action == Action::"invoke", resource)
    when { context.notADeclaredRead };
{{- end }}

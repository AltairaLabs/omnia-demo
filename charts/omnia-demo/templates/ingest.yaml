{{- if .Values.memory.enabled }}
{{- $tokenDir := "/var/run/secrets/omnia/session-api" }}
{{- $s3 := .Values.memory.minio.enabled }}
# Ingests the fixture documents as institutional memory. By default straight
# from the fixtures ConfigMap (SOURCE_DIR). With memory.minio.enabled it shows
# the S3 path instead: the fixtures are uploaded to an in-cluster MinIO and the
# ingestion service reads them back out of the bucket.
apiVersion: batch/v1
kind: Job
metadata:
  name: omnia-demo-memory-ingest
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      {{- if $s3 }}
      initContainers:
        - name: upload-fixtures
          image: {{ .Values.memory.minio.mcImage }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until mc alias set local http://memory-s3:9000 {{ .Values.memory.minio.accessKey }} {{ .Values.memory.minio.secretKey }}; do sleep 2; done
              mc mb --ignore-existing local/{{ .Values.memory.s3.bucket }}
              mc cp /fixtures/*.md local/{{ .Values.memory.s3.bucket }}/{{ .Values.memory.s3.prefix }}
          volumeMounts:
            - { name: fixtures, mountPath: /fixtures }
      {{- end }}
      containers:
        - name: ingest
          image: {{ include "omnia-demo.image" (dict "root" $ "image" .Values.memory.image) }}
          imagePullPolicy: {{ .Values.memory.image.pullPolicy }}
          env:
            - { name: MEMORY_API_URL, value: {{ include "omnia-demo.memoryURL" . | quote }} }
            - { name: WORKSPACE_ID, value: {{ default (include "omnia-demo.workspaceName" .) .Values.memory.workspaceID | quote }} }
            - { name: MEMORY_SOURCE, value: {{ .Values.memory.source | quote }} }
            {{- if $s3 }}
            - { name: S3_BUCKET, value: {{ .Values.memory.s3.bucket | quote }} }
            - { name: S3_PREFIX, value: {{ .Values.memory.s3.prefix | quote }} }
            - { name: S3_REGION, value: {{ .Values.memory.s3.region | quote }} }
            - { name: S3_ENDPOINT, value: {{ .Values.memory.s3.endpoint | quote }} }
            - { name: S3_FORCE_PATH_STYLE, value: {{ .Values.memory.s3.forcePathStyle | quote }} }
            - { name: AWS_ACCESS_KEY_ID, value: {{ .Values.memory.minio.accessKey | quote }} }
            - { name: AWS_SECRET_ACCESS_KEY, value: {{ .Values.memory.minio.secretKey | quote }} }
            {{- else }}
            - { name: SOURCE_DIR, value: /fixtures }
            {{- end }}
            {{- if .Values.memory.auth.secretName }}
            - { name: MEMORY_TOKEN_PATH, value: /var/run/omnia/memory-token/token }
            {{- else if .Values.memory.serviceAuth.enabled }}
            - { name: MEMORY_TOKEN_PATH, value: {{ $tokenDir }}/token }
            {{- end }}
          volumeMounts:
            {{- if not $s3 }}
            - { name: fixtures, mountPath: /fixtures, readOnly: true }
            {{- end }}
            {{- if .Values.memory.auth.secretName }}
            - { name: memory-token, mountPath: /var/run/omnia/memory-token, readOnly: true }
            {{- else if .Values.memory.serviceAuth.enabled }}
            - { name: session-api-token, mountPath: {{ $tokenDir }}, readOnly: true }
            {{- end }}
      volumes:
        - name: fixtures
          configMap: { name: omnia-demo-memory-fixtures }
        {{- if .Values.memory.auth.secretName }}
        - name: memory-token
          secret:
            secretName: {{ .Values.memory.auth.secretName }}
            items:
              - key: {{ .Values.memory.auth.secretKey }}
                path: token
        {{- else if .Values.memory.serviceAuth.enabled }}
        # Omnia's internal service auth: a ServiceAccount token bound to the
        # audience memory-api enforces.
        - name: session-api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.memory.serviceAuth.audience }}
                  expirationSeconds: {{ .Values.memory.serviceAuth.tokenExpirationSeconds }}
        {{- end }}
{{- end }}

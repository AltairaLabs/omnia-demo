{{- if .Values.memory.enabled }}
{{- $tokenDir := "/var/run/secrets/omnia/session-api" }}
{{- $blob := .Values.memory.blob }}
# Ingests the company's documents as institutional memory, on a schedule. The
# connector reads a private Azure Blob container keylessly, through the
# ServiceAccount's workload identity, and sends memory-api only what changed.
#
# It is a CronJob, not a Helm hook: an upgrade never runs it. `make
# azure-memory` starts one run at once with
# `kubectl create job --from=cronjob/memory-ingest`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: memory-ingest
  namespace: {{ .Values.namespace }}
  {{- with .Values.workspace.runtimeIdentity.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: memory-ingest
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.memory.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: memory-ingest
            azure.workload.identity/use: "true"
        spec:
          serviceAccountName: memory-ingest
          restartPolicy: OnFailure
          containers:
            - name: ingest
              image: {{ include "omnia-demo.image" (dict "root" $ "image" .Values.memory.image) }}
              imagePullPolicy: {{ .Values.memory.image.pullPolicy }}
              env:
                - { name: MEMORY_API_URL, value: {{ include "omnia-demo.memoryURL" . | quote }} }
                - { name: WORKSPACE_ID, value: {{ default (include "omnia-demo.workspaceName" .) .Values.memory.workspaceID | quote }} }
                - { name: MEMORY_SOURCE, value: {{ .Values.memory.source | quote }} }
                - { name: BLOB_ACCOUNT_URL, value: {{ required "memory.blob.accountURL is required when memory.enabled (deploy/azure/site-values.sh sets it from site.yaml's memory block)" $blob.accountURL | quote }} }
                - { name: BLOB_CONTAINER, value: {{ required "memory.blob.container is required when memory.enabled" $blob.container | quote }} }
                {{- if .Values.memory.auth.secretName }}
                - { name: MEMORY_TOKEN_PATH, value: /var/run/omnia/memory-token/token }
                {{- else if .Values.memory.serviceAuth.enabled }}
                - { name: MEMORY_TOKEN_PATH, value: {{ $tokenDir }}/token }
                {{- end }}
              volumeMounts:
                {{- if .Values.memory.auth.secretName }}
                - { name: memory-token, mountPath: /var/run/omnia/memory-token, readOnly: true }
                {{- else if .Values.memory.serviceAuth.enabled }}
                - { name: session-api-token, mountPath: {{ $tokenDir }}, readOnly: true }
                {{- end }}
          volumes:
            {{- if .Values.memory.auth.secretName }}
            - name: memory-token
              secret:
                secretName: {{ .Values.memory.auth.secretName }}
                items:
                  - key: {{ .Values.memory.auth.secretKey }}
                    path: token
            {{- else if .Values.memory.serviceAuth.enabled }}
            # Omnia's internal service auth: a ServiceAccount token bound to the
            # audience memory-api enforces.
            - name: session-api-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: {{ .Values.memory.serviceAuth.audience }}
                      expirationSeconds: {{ .Values.memory.serviceAuth.tokenExpirationSeconds }}
            {{- end }}
{{- end }}

{{- if .Values.fieldService.enabled }}
{{- $fs := .Values.fieldService }}
{{- if not (or $fs.providerRef .Values.llm.providerRef) }}
---
# The demo's own Provider, rendered only when no shared one is named.
apiVersion: omnia.altairalabs.ai/v1alpha1
kind: Provider
metadata:
  name: field-service-llm
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
spec:
  type: {{ $fs.provider.type }}
  role: llm
  model: {{ $fs.provider.model }}
  credential:
    secretRef:
      name: {{ $fs.provider.secretRef }}
  defaults:
    maxTokens: {{ $fs.provider.maxTokens }}
{{- end }}
---
apiVersion: omnia.altairalabs.ai/v1alpha1
kind: PromptPack
metadata:
  name: field-service-pack
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
spec:
  packName: field-service-pack
  source:
    type: configmap
    configMapRef:
      name: field-service-pack-v1
  version: "1.0.0"
---
# pack.json is COMPILED, not authored here. The source of truth is the
# PromptArena project at demos/field-service/arena. Regenerate with:
#   hack/build-packs.sh field-service
apiVersion: v1
kind: ConfigMap
metadata:
  name: field-service-pack-v1
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
data:
  pack.json: |
{{ .Files.Get "files/arena/field-service-pack.json" | indent 4 }}
---
# Wrenmoor Energy's field-service copilot. A chat agent with no tools at all:
# what it knows comes from the field manuals in institutional memory, which
# the memory job ingests (memory.enabled with
# memory.fixtures: wrenmoor-field-procedures) and the runtime retrieves into
# the prompt's {{ "{{" }}memory_context{{ "}}" }} every turn.
#
# Without the documents in memory the copilot still runs, and says the manuals
# do not cover the question — which is the prompt working, not the demo.
apiVersion: omnia.altairalabs.ai/v1alpha1
kind: AgentRuntime
metadata:
  name: field-service
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
    app.kubernetes.io/component: field-copilot
spec:
  promptPackRef:
    name: field-service-pack
  memory:
    enabled: true
    # Read-only over a curated store: ambient retrieval on, the
    # memory__remember / memory__recall tools off. An engineer's chat is no
    # place to rewrite a safety manual.
    tools:
      enabled: false
    retrieval:
      enabled: true
      strategy: {{ $fs.retrieval.strategy }}
      limit: {{ $fs.retrieval.limit }}
  facades:
    - type: websocket
      port: 8080
      handler: runtime
  runtime:
    replicas: 1
  providers:
    - name: default
      providerRef:
        name: {{ include "omnia-demo.llmProvider" (dict "root" $ "own" "field-service-llm" "demoRef" $fs.providerRef) }}
{{- end }}

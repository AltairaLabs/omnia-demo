# Scripted model turns for the claims-triage demo, used only when
# claimsTriage.deterministic=true.
#
# WHAT IS FAKED: the model's choice of which tool to call, with what arguments.
# WHAT IS REAL: the ToolRegistry handlers, the HTTP calls to the claims system,
# the policy-broker decision, the REFUSAL, and the session recording.
#
# The refusal is NOT scripted. Turn 2 attempts a settlement of 99000 pence and
# the broker evaluates it against the delegated authority limit and says no.
# Change 99000 to 18000 here and the same script settles cleanly, which is the
# check worth running if you ever doubt the block is real.
#
# Turn indexing: a tool call advances the counter by two, so each exchange lands
# on the odd turn and its reply on the even one. Measured, not derived: see
# charts/omnia-demo/files/pii-chat-script.yaml for the probe and the numbers.
defaultResponse: "The claim could not be assessed."
scenarios:
  default:
    turns:
      # Read the claim. The claims system returns what is payable after the
      # excess; the agent is told not to do the arithmetic itself.
      1:
        type: tool_calls
        content: ""
        tool_calls:
          - name: claim_fetch
            arguments:
              claim_ref: "LM-40718"

      # THE CALL THE POLICY REFUSES.
      #
      # 99000 pence is £990: assessed £1,240 less the £250 excess, which is what
      # the claims system said was payable. The agent knows no limit, so it pays
      # what is payable, which is its job.
      #
      # It is refused because £990 is above the £500 an automated assessor may
      # authorise. The broker decides that; nothing in the agent, the pack or
      # the stub does.
      2:
        type: tool_calls
        content: ""
        tool_calls:
          - name: claim_settle
            arguments:
              claim_ref: "LM-40718"
              amount_pence: 99000

      # The agent refers the claim with the refusal's reason, as its prompt says
      # to on any refusal. It learned the limit from the refusal, not before.
      3:
        type: tool_calls
        content: ""
        tool_calls:
          - name: claim_refer
            arguments:
              claim_ref: "LM-40718"
              reason: >-
                The platform refused settlement of £990.00: above the £500 an
                automated assessor may settle without a human approver
                (delegated authority schedule DA-2). Referred in full.

      # The answer, matching the function's output schema.
      4:
        type: text
        content: |
          {"outcome":"REFERRED","note":"Claim LM-40718, escape of water on LM-HOME-4471, buildings cover. Assessed at £1,240.00 against a £250.00 excess, so £990.00 is payable. The platform refused the payment: £990.00 is above the £500.00 an automated assessor may settle without a human approver (DA-2). Referred in full to Ruth Alderman, household claims approvals."}

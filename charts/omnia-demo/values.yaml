namespace: omnia-demo

memory:
  enabled: true
  workspaceID: demo
  apiURL: http://memory-api.omnia-system.svc.cluster.local:8080
  source: public-s3-demo
  # Optional bearer token for protected memory-api installations. The Secret
  # must already exist in this namespace; no credential is generated by the
  # chart.
  auth:
    secretName: ""
    secretKey: token
  image:
    repository: ghcr.io/altairalabs/omnia-demo-memory-ingestion
    tag: latest
    pullPolicy: IfNotPresent
  s3:
    bucket: omnia-memory
    prefix: fixtures/
    region: us-east-1
    endpoint: http://memory-s3:9000
    forcePathStyle: "true"
  minio:
    enabled: true
    image: quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z
    accessKey: minioadmin
    secretKey: minioadmin

galaxy:
  # Seed the dashboard with synthetic multi-tier memories and relations.
  enabled: false
  workspaceUID: ""
  agentUID: ""
  memoryAPIURL: ""
  seed: "1"
  image:
    repository: ghcr.io/altairalabs/omnia-demo-memory-seeder
    tag: latest
    pullPolicy: IfNotPresent

mortgageUnderwriting:
  # Requires Omnia Enterprise CRDs. Disabled by default so the chart remains
  # useful with a memory-only installation.
  enabled: false
  deterministic: false
  provider:
    type: claude
    model: claude-sonnet-4-6
    secretRef: anthropic-api-key
  image:
    repository: ghcr.io/altairalabs/omnia-demo-mortgage-underwriting
    tag: latest
    pullPolicy: IfNotPresent

piiChat:
  # Requires Omnia Enterprise CRDs for the runtime and privacy policy.
  enabled: false
  image:
    repository: ghcr.io/altairalabs/omnia-demo-mortgage-underwriting
    tag: latest
    pullPolicy: IfNotPresent
  provider:
    type: claude
    model: claude-sonnet-4-6
    secretRef: anthropic-api-key
  privacy:
    redact: true
    strategy: replace
    patterns: [ssn, credit_card, email]

claimsTriage:
  # Requires Omnia Enterprise CRDs for the runtime and policy.
  enabled: false
  image:
    repository: ghcr.io/altairalabs/omnia-demo-mortgage-underwriting
    tag: latest
    pullPolicy: IfNotPresent
  provider:
    type: claude
    model: claude-sonnet-4-6
    secretRef: anthropic-api-key

sharepoint:
  # Requires Omnia Enterprise memory ingestion and AgentRuntime CRDs.
  enabled: false
  workspace: demo
  adapter:
    image:
      repository: ghcr.io/altairalabs/omnia-demo-sharepoint-adapter
      tag: latest
      pullPolicy: IfNotPresent
    siteID: ""
    credentialsSecret: sharepoint-graph-credentials
  provider:
    type: claude
    model: claude-sonnet-4-6
    secretRef: anthropic-api-key

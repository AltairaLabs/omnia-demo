namespace: omnia-demo

# Model access for every demo agent. Set providerRef to a Provider that already
# exists in the namespace (a keyless Azure AI Foundry Provider, say) and every
# agent uses it, and no demo creates a Provider of its own. Empty: each demo
# creates its own Provider from its `provider` block (an API-key Secret).
llm:
  providerRef: ""

# The demo tenant's Workspace. With create: false the chart assumes one already
# owns `namespace`. With create: true, install the release into `namespace`
# with --create-namespace; the operator adopts the namespace.
workspace:
  create: false
  # Defaults to `namespace`.
  name: ""
  displayName: ""
  description: ""
  environment: development
  namespaceLabels: {}
  roleBindings: []
  # The managed service group whose memory-api the memory and Galaxy jobs
  # target (memory-<workspace>-<group>).
  serviceGroup: default
  # Passed through as spec.services, e.g. a managed group with session and
  # memory database Secrets and memory.providerRef (an embedding Provider).
  services: []
  storage: {}
  privacy: {}
  costControls: {}
  # The workspace-wide runtime ServiceAccount (spec.runtime). With
  # workload identity, annotate it with the identity's client and tenant ids
  # and label the pods.
  # The identity every agent runs with (spec.runtime). On Omnia >= beta.23 set
  # serviceAccountAnnotations: they go on each agent's own <agent>-facade
  # ServiceAccount, and the cloud side federates one credential per agent.
  runtimeIdentity:
    serviceAccountAnnotations: {}
    podLabels: {}
  # Before beta.23: a template ServiceAccount every agent runs as (the chart can
  # create it). From beta.23 its annotations are only copied onto each agent's SA.
  runtimeServiceAccount:
    name: ""
    create: true
    annotations: {}
    podLabels: {}

memory:
  enabled: true
  # The workspace the documents are ingested into: its name or UID. Empty: the
  # chart's Workspace (workspace.name, else namespace). memory-api refuses any
  # other workspace with a 403.
  workspaceID: ""
  # Empty: the workspace's own memory-api (see workspace.serviceGroup).
  apiURL: ""
  source: public-s3-demo
  # Which set of documents to ingest: a directory under the chart's
  # fixtures/. memory-s3 is Larkmere Mutual's operating notes;
  # wrenmoor-field-procedures is Wrenmoor Energy's field manuals, which the
  # fieldService copilot answers from.
  fixtures: memory-s3
  # Optional bearer token for protected memory-api installations. The Secret
  # must already exist in this namespace; no credential is generated by the
  # chart.
  auth:
    secretName: ""
    secretKey: token
  # Without auth.secretName, present an audience-bound projected ServiceAccount
  # token, as Omnia's internalServiceAuth expects.
  serviceAuth:
    enabled: true
    audience: omnia-session-api
    tokenExpirationSeconds: 3600
  image:
    repository: ghcr.io/altairalabs/omnia-demo-memory-ingestion
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  s3:
    bucket: omnia-memory
    prefix: fixtures/
    region: us-east-1
    endpoint: http://memory-s3:9000
    forcePathStyle: "true"
  # The in-cluster S3 the ingest Job reads from: Versity Gateway (Apache-2.0)
  # on its POSIX backend, with the AWS CLI uploading the fixtures. Turn it off
  # and the Job reads the fixtures straight from their ConfigMap (SOURCE_DIR).
  # The keys are for this in-cluster demo bucket only; they guard nothing
  # outside it. Change them if the namespace is shared.
  objectStore:
    enabled: true
    image: docker.io/versity/versitygw:v1.10.0
    uploaderImage: docker.io/amazon/aws-cli:2.39.0
    accessKey: omnia-demo
    secretKey: omnia-demo-s3-secret

# ---------------------------------------------------------------------------
# mortgageUnderwriting — the egress-control demo (DSA-114)
#
# Backend, function-mode: an underwriting case arrives as a typed invocation,
# the agent triages it, and a ToolPolicy refuses any call that would send raw
# bank statement data to the external verification supplier. The tool IS in the
# registry and the agent IS entitled to call it — the refusal turns on what is
# in the payload, which is what makes it a policy decision rather than an
# access-control absence.
#
# Requires Omnia Enterprise: ToolPolicy and the policy broker are EE.
# See demos/mortgage-underwriting/RUNBOOK.md.
# ---------------------------------------------------------------------------
mortgageUnderwriting:
  # -- A Provider in the namespace for this demo alone. Wins over
  # llm.providerRef; use it for a demo that needs its own tuning (output
  # length, stream timeout), which a shared Provider does not carry.
  providerRef: ""
  enabled: false

  # Stub standing in for the case systems and the approved third-party
  # income-verification supplier. Built from demos/mortgage-underwriting.
  image:
    repository: ghcr.io/altairalabs/omnia-demo-mortgage-underwriting
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  # Model behind the triage agent, used only when llm.providerRef is empty.
  # With llm.providerRef set the agent runs on that Provider, and the tuning
  # below does not apply — set the same defaults on the shared Provider.
  provider:
    type: claude
    model: claude-sonnet-4-6
    secretRef: anthropic-api-key
    # -- Maximum output tokens per response.
    #
    # The agent's answer is a full underwriter triage note across seven checks,
    # which on the self-employed case runs to ~3.4k output tokens. The default
    # is well under that, and the truncation does not announce itself: the note
    # is emitted as JSON, so a cut-off arrives at the caller as
    # "unexpected end of JSON input" and reads like a malformed model response.
    #
    # 8192 was still not enough once case_note became a required field and the
    # model stopped folding the note into the recommendation: the note is the
    # bulk of the answer, and it is written out in full.
    maxTokens: 16384
    # -- How long the streaming response may go silent before it is aborted.
    #
    # The default is 30s, and this agent exceeds it: seven tool calls, then a
    # single long structured answer. Observed failing at 34s with
    # "stream chunk error: http2: response body closed" — which names the
    # transport, not the timeout, and so reads like a network fault rather than
    # a setting. The timer resets on every byte, so raising it does not mask a
    # hung provider; it only allows a legitimately slow first token.
    streamIdleTimeout: "120s"
    # -- Extended thinking budget, in tokens. Empty means thinking is off.
    #
    # Reasoning is recorded on the session (it rides a channel separate from
    # content, and the event bridge records every event type), so enabling this
    # writes the model's reasoning about the case into the record. A reasoning
    # trace quotes what it reasoned about — on a real case that can restate the
    # very data a ToolPolicy refuses to let leave. Fine here: the cases are
    # synthetic.
    #
    # Kept well under maxTokens: the thinking budget is spent from the same
    # allowance as the answer, and the answer is a full triage note.
    thinkingBudgetTokens: 2048

  # -- Fire-and-forget invocation for this demo.
  #
  # On by default because the function genuinely needs it: a full underwriting
  # chain is 50-90s, and the synchronous limit is 30s. Invoke it with
  # POST /functions/mortgage-underwriting?mode=async and read the result back
  # with GET /functions/mortgage-underwriting/invocations/{id}.
  #
  # Requires a queue backend in the Omnia installation (Redis). Without one the
  # operator reports AsyncInvocationReady=False and the async routes answer
  # 501 — it does NOT fall back to running the call synchronously, which would
  # fail at 30s anyway.
  async:
    enabled: true
    # Per pod, not per agent: the real ceiling is workers x replicas, and each
    # worker holds one claim and one runtime call.
    workers: 2

  # -- Run the agent from a script rather than a live model.
  #
  # Off by default: the honest demo is a real model genuinely deciding to call
  # these tools, and with a key that is what you get.
  #
  # Turn it ON to capture. A live model is free to work the case in a different
  # order, call a tool twice, or word the case note differently on every take —
  # which is fine in a meeting and miserable when you are cutting a 40-second
  # video and need take 7 to match take 3. Deterministic mode fixes the exact
  # seven-step chain, needs no API key, and still runs through the real
  # ToolRegistry, the real policy broker and the real session recording. The
  # ONLY thing faked is the model's choice of what to call.
  #
  # It always uses the demo's own mock Provider, whatever llm.providerRef says.
  #
  # Say so if asked. "The model's turns are scripted for the recording; the
  # enforcement, the tools and the record are live" is a fine answer. Claiming
  # a scripted run is live reasoning is not.
  deterministic: false

# ---------------------------------------------------------------------------
# piiChat — Larkmere's member assistant (demos 6, 7 and 9)
#
# A signed-in member's assistant: card tools that act on that member, user
# memory, and a SessionPrivacyPolicy that strips a pasted card number from the
# stored transcript.
#
# What this demo does NOT show, and must not be narrated as showing: inbound
# redaction. The member's text reaches the model intact. Omnia has no control
# that strips PII before the model; the redaction is on the write path into
# session-api. See demos/pii-chat/RUNBOOK.md.
#
# Requires Omnia Enterprise CRDs for the runtime and privacy policy.
# ---------------------------------------------------------------------------
piiChat:
  # -- A Provider in the namespace for this demo alone. Wins over
  # llm.providerRef; use it for a demo that needs its own tuning (output
  # length, stream timeout), which a shared Provider does not carry.
  providerRef: ""
  enabled: false

  # The card system's backend. Same image and same Go binary as the mortgage
  # stubs: it serves the card endpoints alongside that demo's seven.
  #
  # The repository name reads as mortgage-specific because it is shared, not
  # because this demo is part of that one. A second image would have to be
  # built, published and kept alive to buy nothing but a tidier name.
  image:
    repository: ghcr.io/altairalabs/omnia-demo-mortgage-underwriting
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  # Model behind the support agent, used only when llm.providerRef is empty.
  provider:
    type: claude
    model: claude-sonnet-4-6
    secretRef: anthropic-api-key
    # -- Maximum output tokens per response.
    #
    # A support turn is two or three sentences. The default would do; this is
    # set explicitly so a longer scripted variant does not get truncated into
    # something that reads as a model fault.
    maxTokens: 2048

  # -- The policy under demonstration.
  #
  # These are the values you change on camera. `helm upgrade --reuse-values
  # --set piiChat.privacy.strategy=mask` re-renders the SessionPrivacyPolicy and
  # takes effect on the next NEW session — start a fresh conversation, do not
  # re-drive the open one.
  privacy:
    # -- Turn redaction off to show the same conversation stored in the clear.
    #
    # Worth one take: the contrast between an unredacted and a redacted record
    # of the identical conversation is a stronger argument than either alone.
    redact: true
    # -- replace | mask | hash
    #
    # replace -> [REDACTED_CC]; mask -> ************4471; hash -> [HASH_CC:a1b2...].
    #
    # replace is the one to film. The token names the KIND of thing that was
    # removed, so the record alone tells a viewer "a card number was here and
    # the policy took it". mask shows that something was scrubbed but not what.
    #
    # It also matches the Omnia chart's global default policy, which matters
    # beyond taste: memory-api resolves its policy with an EMPTY agent name, so
    # the per-agent privacyPolicyRef is skipped there and memory redaction falls
    # through to the global default. With both on replace, a session beat and a
    # memory beat render identically instead of raising a question you then
    # have to answer on camera.
    strategy: replace
    # -- Which built-in patterns apply. Also accepts custom:<go-regexp>.
    #
    # phone_number is deliberately ABSENT. Its regex matches any bare ten-digit
    # run, so with it enabled a case number, order ID or reference in the
    # conversation is silently redacted too — which on camera reads as a bug
    # rather than as a policy. Add it back if the script has no other long
    # digit strings in it.
    patterns:
      - ssn
      - credit_card
      - email

  # -- Cross-session memory, for the third redaction beat.
  #
  # Adds memory__remember / memory__recall to the agent so the demo can show
  # memory-api's redaction alongside session-api's. Two things make that beat
  # worth its minute:
  #
  #   * The memory redactor is provenance-aware. Structural patterns (SSN, card,
  #     IP) are scrubbed from everything; email and phone survive in a
  #     user_requested or operator_curated memory, so "remember my work email
  #     is …" keeps working while a regulatory identifier never lands.
  #   * It is the ONLY path that emits pii_redacted, so it is the only thing
  #     that moves the redactions counter on /memory-analytics. The session
  #     path emits nothing at all.
  #
  # Needs no embedding provider: memory-api runs the consent classifier in
  # regex-only mode when none is configured, which is all this demo requires.
  #
  # The deterministic script calls memory__recall and memory__remember, so
  # leave this on when deterministic is true.
  #
  # GOTCHA: the consent classifier runs BEFORE redaction and upgrades
  # PII-bearing content to memory:identity, so a write without a matching
  # consent grant is dropped at 204 and redaction never runs — which looks
  # exactly like a broken agent. The WebSocket message carries a per-turn
  # `consent_grants` array; see demos/pii-chat/RUNBOOK.md.
  memory:
    enabled: true
    # Ambient retrieval into the prompt's memory_context variable: the agent knows
    # the member from the first turn (pii-chat-agent.yaml).
    retrieval: true

  # -- Run the agent from a script rather than a live model.
  #
  # Off by default: the honest demo is a real model genuinely asking for the
  # identifiers and genuinely calling the tool, and with a key that is what you
  # get.
  #
  # OUT OF DATE: the script still replays the retired SSN-in-chat conversation.
  # Rewrite it before turning this on.
  #
  # Turn it ON to capture. Deterministic mode needs no API key and fixes the
  # exact conversation, while the tool calls, the card system, the privacy
  # policy and the session record all stay live. The ONLY thing
  # faked is the assistant's words. It always uses the demo's own mock
  # Provider, whatever llm.providerRef says.
  #
  # It also fixes the USER's lines, which the mortgage demo does not have to
  # worry about: the script replies by turn index, so an off-script question
  # gets the next scripted answer anyway. Type the lines in
  # demos/pii-chat/RUNBOOK.md verbatim.
  #
  # Say so if asked. "The assistant's turns are scripted for the recording; the
  # tool call, the policy and the record are live" is a fine answer.
  deterministic: false

  # -- Larkmere Mutual member portal — the customer-facing surface.
  #
  # Off by default like every other demo component. When on, the AgentRuntime
  # also gains externalAuth.edgeTrust so the portal can proxy the conversation
  # and assert the member's identity; without the portal the agent keeps its
  # default posture and rejects unauthenticated callers.
  #
  # Why a portal at all: the dashboard Console is an OPERATOR surface, and
  # filming a cardholder typing their card number into admin tooling implies customers
  # can reach your ops console. It is also the only place an EU AI Act Art. 50
  # disclosure is actually DELIVERED to a person — the panel renders it from
  # `connected.ai_disclosure` on the wire rather than hardcoding it, which is
  # what makes session-api's ai_disclosure_delivered column mean something.
  portal:
    enabled: false
    # Built from demos/demo-sites, the one image for every brand's site, run
    # with --site larkmere-mutual. The site is embedded in the binary, so
    # there is no ConfigMap and nothing to keep in step at runtime.
    image:
      repository: ghcr.io/altairalabs/omnia-demo-sites
      # Empty: the chart's appVersion.
      tag: ""
      pullPolicy: IfNotPresent
    # -- Your data: the member's own consent, memories and erasure requests,
    # through Omnia's end-user plane (management-api /api/v1/me). Turning it
    # on sets the Workspace's spec.endUserAuth.oidc to the portal's issuer,
    # with this audience, so management-api accepts the member's token and
    # nothing else on those routes. Needs Enterprise and workspace.privacy.
    myData:
      enabled: false
      # The aud of the member's token for the end-user plane. Never the
      # agent's: a token minted for a conversation must not also open the
      # member's privacy controls (Omnia's docs, "Let end users manage their
      # own data").
      audience: larkmere-members
      # management-api, as the portal reaches it in the cluster.
      managementURL: http://omnia-management-api.omnia:8080

  # -- The eval-gated canary (Larkmere Mutual).
  #
  # Installs what `make canary` rolls out: two candidate versions of the card
  # support pack (2.0.0, a good change; 2.1.0, a regression that acts on a card
  # before verifying the caller), each with an LLM judge, a RolloutAnalysis
  # gate per version, and scripted callers that give the rollout traffic. The
  # rollout itself is not in the chart: `make canary VERSION=2.0` patches it
  # onto the AgentRuntime and `make canary-reset` takes it off, since a
  # promotion rewrites spec.promptPackRef and a chart that owned the rollout
  # would start it again on the next upgrade.
  #
  # Needs the portal (edge-trust identity, which the callers assert too), the
  # Enterprise RolloutAnalysis CRD and the eval worker, which this turns on for
  # the workspace's service group.
  canary:
    enabled: false
    # The judge runs on the agent's own model (`default`): on Omnia
    # 0.9.0-beta.23 a pack cannot name a separate judge provider (Omnia #3965,
    # demos/pii-chat/canary/eval.jq).
    # The gate: the candidate's average judge score, measured `count` times,
    # `interval` apart, each at least minScore.
    gate:
      minScore: "0.8"
      count: 3
      interval: 90s
    # The eval worker runs as this ServiceAccount, with the runtime identity's
    # annotations, so the judge can reach a keyless Provider. omnia-azure's
    # `make workspace-identity` federates it.
    evalWorkerServiceAccount: eval-worker
    # Scripted callers (demos/card-callers, in the sites image). Scaled to 0
    # until `make canary` starts them.
    callers:
      pause: 20s

# ---------------------------------------------------------------------------
# claimsTriage — Larkmere Mutual claims triage, the delegated-authority demo
#
# A claims assessor that may settle up to £500 on its own and must refer
# anything above that to a human. The rule is enforced by a ToolPolicy the
# policy broker evaluates before dispatch, NOT by the agent's own judgement and
# NOT by the claims system — see charts/omnia-demo/templates/claims-triage-tools.yaml
# for why both of those would have hidden the control.
#
# Requires Omnia Enterprise CRDs for the runtime and policy.
# ---------------------------------------------------------------------------
claimsTriage:
  # -- A Provider in the namespace for this demo alone. Wins over
  # llm.providerRef; use it for a demo that needs its own tuning (output
  # length, stream timeout), which a shared Provider does not carry.
  providerRef: ""
  enabled: false
  # -- The agent looks up the society's procedure for each claim's peril in
  # institutional memory (memory__recall). Needs memory.enabled for the
  # documents. The flood gap demo (demo 11) adds the flood procedure on stage:
  # demos/claims-triage/RUNBOOK.md.
  procedures: false

  # The claims system stub. Same image and same Go binary as the mortgage
  # stubs — it serves /claim, /claim-policy, /claim-settle and /claim-refer
  # alongside that demo's endpoints and the card-support identity check.
  image:
    repository: ghcr.io/altairalabs/omnia-demo-mortgage-underwriting
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  # Model behind the assessor, used only when llm.providerRef is empty.
  provider:
    type: claude
    model: claude-sonnet-4-6
    secretRef: anthropic-api-key
    maxTokens: 2048

  # Deterministic mode swaps the live provider for the mock and a scripted
  # chain, whatever llm.providerRef says. Unlike the mortgage demo this is not
  # the ONLY path to the refusal — a live model asked to settle £990 will
  # attempt it, because the amount is correct for the claim and the tool does
  # not tell it the limit. It is the repeatable path, which is what a
  # recording wants.
  deterministic: false

# ---------------------------------------------------------------------------
# incidentAgent — Wrenmoor Energy's on-call incident agent: policy on
# consequence
#
# A chat agent for the platform team. It reads alerts, logs and deploy history,
# diagnoses incidents, and can roll back a deploy or scale a service. Every
# tool declares its action_scope (effect, reversibility) in the pack, and the
# ToolPolicy forbids any call whose declared reversibility is irreversible —
# or that declares nothing — whatever the tool is called. Deleting a namespace
# and failing a database over are in the registry; the policy is what stops
# them. See charts/omnia-demo/templates/incident-agent-tools.yaml.
#
# Requires Omnia Enterprise: ToolPolicy and the policy broker are EE.
# ---------------------------------------------------------------------------
incidentAgent:
  # -- A Provider in the namespace for this demo alone. Wins over
  # llm.providerRef.
  providerRef: ""
  enabled: false

  # The on-call back end: alerts, logs, deploys, and the actions on them. Same
  # image and same Go binary as the mortgage stubs (demos/mortgage-underwriting,
  # wrenmoor.go). State is in memory: a rollback shows in the deploy history
  # until the pod restarts, which puts the seeded incident back for the next
  # take.
  image:
    repository: ghcr.io/altairalabs/omnia-demo-mortgage-underwriting
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  # Model behind the agent, used only when no providerRef applies.
  provider:
    type: claude
    model: claude-sonnet-4-6
    secretRef: anthropic-api-key
    maxTokens: 2048

  # -- Ask the grid analyst over A2A about output at an alert's affected
  # generation sites. Takes effect only with dataAnalyst.enabled and
  # dataAnalyst.a2a.enabled; the tool appears as
  # a2a__grid_analyst__site_output.
  a2a:
    enabled: true
    # Above the analyst's longest turn: a slower call fails here while the
    # analyst runs on.
    timeout: 90s

# ---------------------------------------------------------------------------
# dataAnalyst — Wrenmoor Energy's grid analyst: a function, a schedule and an
# A2A peer
#
# A FUNCTION with typed input and output for questions about Wrenmoor Energy's
# generation sites (Wrenmoor Edge, Cragg Vale Solar, Heptonstall Store) and
# its energy mix, over a synthetic dataset, fired every morning by a ScheduledFunction
# that carries a cursor between runs to write a daily digest. With a2a on, the
# same pack also runs as an agent behind an A2A facade (data-analyst-a2a),
# because a function-mode AgentRuntime serves only rest and mcp facades and so
# cannot be an A2A target itself.
#
# Requires Omnia Enterprise CRDs for the runtime, policy and schedule.
# ---------------------------------------------------------------------------
# -- Halvern Partners' research function (demo 10, research on a budget).
#
# One client matter per invocation, run in batches (hack/research-batch.sh)
# under the workspace's daily budget (workspace.costControls). It runs on a
# mock Provider, at a fraction of a cent a run, against a cap of fractions of a
# cent: spending real money to show that spending stops would be burning it.
# Put it in a workspace of its own (profiles/azure/halvern-research.yaml): a
# budget covers every agent in its workspace, and reaching it would block them
# all.
researchFunction:
  enabled: false

dataAnalyst:
  # -- A Provider in the namespace for this demo alone. Wins over
  # llm.providerRef.
  providerRef: ""
  enabled: false

  # The generation dataset. Same image as the mortgage stubs; deterministic, so the
  # same question gets the same figures on every take.
  image:
    repository: ghcr.io/altairalabs/omnia-demo-mortgage-underwriting
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  provider:
    type: claude
    model: claude-sonnet-4-6
    secretRef: anthropic-api-key
    maxTokens: 2048

  # -- Serve the pack over A2A as data-analyst-a2a, for incidentAgent.
  a2a:
    enabled: true

  # -- The daily digest: a ScheduledFunction firing the function.
  digest:
    enabled: true
    cron: "0 6 * * *"
    timezone: Europe/London
    # Forbid: a digest still running when the next one is due is skipped, not
    # doubled. The CRD's own advice for cursor-carrying schedules.
    concurrencyPolicy: Forbid
    # Explicitly false. Unset means "not reviewed", which an operator holding
    # unreviewed schedules treats as suspended. A digest is a few cents of
    # model time a day; set true to stop it without deleting it.
    suspend: false
    timeoutSeconds: 60
    # The cursor before the first fire. Empty: the first digest covers
    # yesterday alone, rather than the dataset's whole history.
    initialCursor: ""

# ---------------------------------------------------------------------------
# fieldService — Wrenmoor Energy's field-service copilot: institutional memory
#
# A chat agent that answers engineers' questions about switching, isolation
# and safety, fault finding and meter exchange from the field manuals. The
# manuals are documents ingested into the workspace's institutional memory by
# the memory job (memory.enabled, with memory.fixtures:
# wrenmoor-field-procedures), and retrieved into the prompt every turn.
#
# Requires Omnia Enterprise institutional memory, and a workspace memory
# service with an embedding provider for semantic retrieval.
# ---------------------------------------------------------------------------
fieldService:
  # -- A Provider in the namespace for this demo alone. Wins over
  # llm.providerRef.
  providerRef: ""
  enabled: false

  provider:
    type: claude
    model: claude-sonnet-4-6
    secretRef: anthropic-api-key
    maxTokens: 1024

  # Ambient retrieval from memory each turn, into the prompt's
  # {{memory_context}}. The memory tools stay off: the copilot reads the
  # manuals and has no business writing to them.
  retrieval:
    strategy: semantic
    limit: 4

# ---------------------------------------------------------------------------
# wren — Wrenmoor Energy's customer assistant: consent before a contract change
#
# A chat agent in the customer portal's side panel (wrenmoorSite). It reads
# the signed-in customer's bill, half-hourly usage and local weather, quotes
# tariffs against their own usage, and switches tariff only with their OK:
# request_consent is a client tool the portal renders as "Needs your OK", and
# switch_tariff is refused without the consent_id that click creates — by the
# ToolPolicy before dispatch, and by the account system after it. See
# charts/omnia-demo/templates/wren-tools.yaml.
#
# Requires Omnia Enterprise: ToolPolicy and the policy broker are EE.
# ---------------------------------------------------------------------------
wren:
  # -- A Provider in the namespace for this demo alone. Wins over
  # llm.providerRef.
  providerRef: ""
  enabled: false

  # The account system: Amira's bills, usage, weather, tariffs, and the
  # consent and receipt routes. Same image as the mortgage stubs
  # (demos/mortgage-underwriting, wren.go). In memory, so a pod restart puts
  # Amira back on Moor Steady for the next take.
  image:
    repository: ghcr.io/altairalabs/omnia-demo-mortgage-underwriting
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  # Model behind the agent, used only when no providerRef applies.
  provider:
    type: claude
    model: claude-sonnet-4-6
    secretRef: anthropic-api-key
    maxTokens: 1024

  # -- How long a "Needs your OK" card waits for the customer's click
  # (the websocket facade's clientToolTimeout). On timeout the request is
  # denied and nothing changes.
  consentTimeout: 5m

# ---------------------------------------------------------------------------
# wrenmoorSite — Wrenmoor Energy's websites
#
# The public site, the customer portal with the Wren panel, and the Wrenmoor
# Hub intranet: the demo-sites image run with --site wrenmoor-energy. Serve it
# through the catalogue at /wrenmoor-energy (catalogue.proxies); every URL in
# the site is relative, so it needs no rewrites. With wren on, the AgentRuntime
# also gains externalAuth.edgeTrust so the site can proxy the conversation and
# assert the customer's identity.
# ---------------------------------------------------------------------------
wrenmoorSite:
  enabled: false
  # Built from demos/demo-sites, the one image for every brand's site.
  image:
    repository: ghcr.io/altairalabs/omnia-demo-sites
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# halvernSite — Halvern Partners' websites
#
# The public site, the Practice Desk and the design-system reference: the
# demo-sites image run with --site halvern-partners. Serve it through the
# catalogue at /halvern-partners (catalogue.proxies); every URL in the site is
# relative, so it needs no rewrites.
# ---------------------------------------------------------------------------
halvernSite:
  enabled: false
  image:
    repository: ghcr.io/altairalabs/omnia-demo-sites
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

sharepoint:
  # Requires Omnia Enterprise memory ingestion and AgentRuntime CRDs.
  enabled: false
  workspace: demo
  adapter:
    image:
      repository: ghcr.io/altairalabs/omnia-demo-sharepoint-adapter
      # Empty: the chart's appVersion.
      tag: ""
      pullPolicy: IfNotPresent
    siteID: ""
    credentialsSecret: sharepoint-graph-credentials
  provider:
    type: claude
    model: claude-sonnet-4-6
    secretRef: anthropic-api-key

catalogue:
  # A static page describing every demo tenant and its demos, served on the
  # dashboard's own host at `path`, behind the dashboard's sign-in. Enable it in
  # one release only. The page is files/catalogue/index.html.
  enabled: false
  path: /demo-catalog
  image: nginxinc/nginx-unprivileged:1.27.3-alpine
  # management-api's in-cluster base URL, e.g.
  # http://omnia-management-api.omnia.svc.cluster.local:8080. nginx checks each
  # request's session cookie against <authURL>/api/v1/auth/me. Empty serves the
  # page to anyone, with no sign-in.
  authURL: ""
  # Where a caller with no session is sent (relative to the dashboard host).
  loginPath: /api/v1/auth/login
  # Other in-cluster sites to serve under a path on the dashboard host, behind
  # the same sign-in, e.g. a demo's customer-facing portal:
  #   - path: /larkmere-mutual
  #     upstream: http://larkmere-portal.<ns>.svc.cluster.local:8080
  #     rewrites:            # absolute paths the site uses, put under the prefix
  #       - { from: '"/api/assistant/ws"', to: '"/larkmere-mutual/api/assistant/ws"' }
  #   - path: /wrenmoor-energy  # every URL relative: no rewrites
  #     upstream: http://wrenmoor-site.<ns>.svc.cluster.local:8080
  proxies: []
  route:
    enabled: true
    # The Gateway the dashboard's HTTPRoute uses, e.g.
    # [{name: omnia-external, namespace: omnia}].
    parentRefs: []
    # The dashboard's host, e.g. [omnia.example.com].
    hostnames: []

# ---------------------------------------------------------------------------
# galaxy — the memory Galaxy (Larkmere Mutual)
#
# A generated corpus (demos/memory-galaxy) of what members talk about and what
# the society knows, across the user, user_for_agent, agent and institutional
# tiers, with the institutional knowledge graph. The memory-seeder image embeds
# it; a Job replays it as memory-api's own ServiceAccount, then fits the
# Galaxy's clusters. The chart also installs the MemoryPolicy that declares its
# types and relations, and points the Workspace's memory service at it.
# ---------------------------------------------------------------------------
galaxy:
  enabled: false
  # Directory under demos/memory-seeder/fixtures/.
  fixture: larkmere-galaxy
  # AgentRuntimes the corpus writes agent and user_for_agent memories for.
  agents: [pii-chat, claims-triage, mortgage-underwriting]
  serviceGroup: default
  # MemoryPolicy name; empty is <workspace>-memory.
  policyName: ""
  leaves: 24
  # How long the seed Job may run, waiting for memory-api and the agents
  # included, before it fails.
  deadlineSeconds: 3600
  # MemoryPolicy spec.tiers: how long each kind of memory lives. A member's
  # circumstances go stale in months; their identity and claims history
  # matter for years; what the society knows is curated, not expired. The
  # seeder also gives each agent memory its own expiry inside the agent
  # tier's maxAge, so they don't all lapse on one day.
  # Omnia 0.9.0-beta.23's MemoryPolicy takes only ttl and perCategory here (no
  # retention mode): an institutional tier with no ttl never expires.
  retention:
    institutional: {}
    agent:
      ttl: { default: 365d, maxAge: 730d }
    user:
      ttl: { default: 365d, maxAge: 1825d }
      perCategory:
        memory:context: { ttl: { default: 90d, maxAge: 180d } }
        memory:health: { ttl: { default: 180d, maxAge: 365d } }
        memory:location: { ttl: { default: 365d, maxAge: 730d } }
        memory:preferences: { ttl: { default: 730d, maxAge: 1095d } }
        memory:history: { ttl: { default: 1095d, maxAge: 1825d } }
        memory:identity: { ttl: { default: 1825d, maxAge: 1825d } }
  # MemoryPolicy spec.consentRevocation.action: SoftDelete, HardDelete or Stop.
  consentRevocation: SoftDelete
  graphExpansion:
    hops: 1
    maxAdded: 10
    relationTypes: [governs, about, covers]
  # memory-api's internal-auth audience for the seeder's token.
  tokenAudience: omnia-session-api
  kubectlImage: docker.io/alpine/k8s:1.31.1
  image:
    repository: ghcr.io/altairalabs/omnia-demo-memory-seeder
    tag: ""
    pullPolicy: IfNotPresent

# -- Every demo image at once, for dev builds (`make images`). `registry`
# replaces the registry and organisation of each image's repository (its last
# path segment is kept: ghcr.io/altairalabs/omnia-demo-sites becomes
# <registry>/omnia-demo-sites), and `tag` overrides every image's tag. Empty:
# each image's own repository and tag.
images:
  registry: ""
  tag: ""

namespace: omnia-demo

# Model access for every demo agent. Set providerRef to a Provider that already
# exists in the namespace (a keyless Azure AI Foundry Provider, say) and every
# agent uses it, and no demo creates a Provider of its own. Empty: each demo
# creates its own Provider from its `provider` block (an API-key Secret).
llm:
  providerRef: ""

# The demo tenant's Workspace. With create: false the chart assumes one already
# owns `namespace`. With create: true, install the release into `namespace`
# with --create-namespace; the operator adopts the namespace.
workspace:
  create: false
  # Defaults to `namespace`.
  name: ""
  displayName: ""
  description: ""
  environment: development
  namespaceLabels: {}
  roleBindings: []
  # The managed service group whose memory-api the memory and Galaxy jobs
  # target (memory-<workspace>-<group>).
  serviceGroup: default
  # Passed through as spec.services, e.g. a managed group with session and
  # memory database Secrets and memory.providerRef (an embedding Provider).
  services: []
  storage: {}
  privacy: {}
  costControls: {}
  # The workspace-wide runtime ServiceAccount (spec.runtime). With
  # workload identity, annotate it with the identity's client and tenant ids
  # and label the pods.
  runtimeServiceAccount:
    name: ""
    create: true
    annotations: {}
    podLabels: {}

memory:
  enabled: true
  workspaceID: demo
  # Empty: the workspace's own memory-api (see workspace.serviceGroup).
  apiURL: ""
  source: public-s3-demo
  # Optional bearer token for protected memory-api installations. The Secret
  # must already exist in this namespace; no credential is generated by the
  # chart.
  auth:
    secretName: ""
    secretKey: token
  # Without auth.secretName, present an audience-bound projected ServiceAccount
  # token, as Omnia's internalServiceAuth expects.
  serviceAuth:
    enabled: true
    audience: omnia-session-api
    tokenExpirationSeconds: 3600
  image:
    repository: ghcr.io/altairalabs/omnia-demo-memory-ingestion
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  s3:
    bucket: omnia-memory
    prefix: fixtures/
    region: us-east-1
    endpoint: http://memory-s3:9000
    forcePathStyle: "true"
  minio:
    enabled: true
    image: quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z
    accessKey: minioadmin
    secretKey: minioadmin

galaxy:
  # Seed the dashboard's Memory Galaxy with synthetic institutional, agent and
  # user memories. Requires Omnia Enterprise (Galaxy and institutional memory)
  # and a workspace memory service with an embedding provider.
  enabled: false
  workspaceUID: ""
  agentUID: ""
  # Namespace of the target Workspace (its spec.namespace.name). The seed Job
  # runs there: memory-api trusts ServiceAccounts from that namespace only, and
  # the workspace pseudonym key Secret lives there. Defaults to `namespace`.
  namespace: ""
  # The workspace memory-api, e.g. http://memory-<workspace>-<group>.<ns>:8080
  # (kubectl get workspace <name> -o jsonpath='{.status.services[*].memoryURL}').
  # Required when galaxy.namespace is set; otherwise defaults to memory.apiURL.
  memoryAPIURL: ""
  seed: "1"
  # After seeding, drain pending embeddings and fit the Galaxy's leaf clusters
  # so the dashboard shows the cluster tree instead of its flat fallback.
  buildGalaxy: true
  # The workspace's pseudonym key, written by the Omnia operator. Read through
  # a secretKeyRef only; never set the key in values.
  pseudonymKey:
    secretName: omnia-workspace-pseudonym-key
    secretKey: key
  # Present an audience-bound projected ServiceAccount token, as Omnia's
  # internalServiceAuth expects. Harmless when that auth is off.
  serviceAuth:
    enabled: true
    audience: omnia-session-api
    tokenExpirationSeconds: 3600
  image:
    repository: ghcr.io/altairalabs/omnia-demo-memory-seeder
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

mortgageUnderwriting:
  # Requires Omnia Enterprise CRDs. Disabled by default so the chart remains
  # useful with a memory-only installation.
  enabled: false
  deterministic: false
  provider:
    type: claude
    model: claude-sonnet-4-6
    secretRef: anthropic-api-key
  image:
    repository: ghcr.io/altairalabs/omnia-demo-mortgage-underwriting
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

piiChat:
  # Requires Omnia Enterprise CRDs for the runtime and privacy policy.
  enabled: false
  image:
    repository: ghcr.io/altairalabs/omnia-demo-mortgage-underwriting
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  provider:
    type: claude
    model: claude-sonnet-4-6
    secretRef: anthropic-api-key
  privacy:
    redact: true
    strategy: replace
    patterns: [ssn, credit_card, email]
  portal:
    enabled: false
    image:
      repository: ghcr.io/altairalabs/omnia-demo-larkmere-portal
      # Empty: the chart's appVersion.
      tag: ""
      pullPolicy: IfNotPresent

claimsTriage:
  # Requires Omnia Enterprise CRDs for the runtime and policy.
  enabled: false
  image:
    repository: ghcr.io/altairalabs/omnia-demo-mortgage-underwriting
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  provider:
    type: claude
    model: claude-sonnet-4-6
    secretRef: anthropic-api-key

sharepoint:
  # Requires Omnia Enterprise memory ingestion and AgentRuntime CRDs.
  enabled: false
  workspace: demo
  adapter:
    image:
      repository: ghcr.io/altairalabs/omnia-demo-sharepoint-adapter
      # Empty: the chart's appVersion.
      tag: ""
      pullPolicy: IfNotPresent
    siteID: ""
    credentialsSecret: sharepoint-graph-credentials
  provider:
    type: claude
    model: claude-sonnet-4-6
    secretRef: anthropic-api-key

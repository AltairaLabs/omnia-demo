name: Public demo validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            memory-ingestion/go.sum
      - run: go test ./demos/...
      - run: go vet ./demos/...
      - run: go mod tidy
        working-directory: memory-ingestion
      - run: go test ./...
        working-directory: memory-ingestion
      - run: go vet ./...
        working-directory: memory-ingestion

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/omnia-demo
      - run: helm template omnia-demo charts/omnia-demo >/dev/null

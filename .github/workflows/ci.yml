name: Public demo validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            memory-ingestion/go.sum
      - name: Install yq v4
        run: |
          curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq
      - run: go test ./demos/... ./deploy/...
      - run: go vet ./demos/... ./deploy/...
      - run: go mod tidy
        working-directory: memory-ingestion
      - run: go test ./...
        working-directory: memory-ingestion
      - run: go vet ./...
        working-directory: memory-ingestion

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/omnia-demo
      - run: helm template omnia-demo charts/omnia-demo >/dev/null

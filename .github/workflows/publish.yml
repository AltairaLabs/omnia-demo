name: Publish demo images

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - memory-ingestion/**
      - demos/memory-seeder/**
      - demos/mortgage-underwriting/**
      - demos/sharepoint-adapter/**
      - demos/larkmere-portal/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: memory-ingestion
            context: memory-ingestion
            file: memory-ingestion/Dockerfile
            image: ghcr.io/altairalabs/omnia-demo-memory-ingestion
          - name: memory-seeder
            context: .
            file: demos/memory-seeder/Dockerfile
            image: ghcr.io/altairalabs/omnia-demo-memory-seeder
          - name: mortgage-underwriting
            context: .
            file: demos/mortgage-underwriting/Dockerfile
            image: ghcr.io/altairalabs/omnia-demo-mortgage-underwriting
          - name: sharepoint-adapter
            context: .
            file: demos/sharepoint-adapter/Dockerfile
            image: ghcr.io/altairalabs/omnia-demo-sharepoint-adapter
          - name: larkmere-portal
            context: .
            file: demos/larkmere-portal/Dockerfile
            image: ghcr.io/altairalabs/omnia-demo-larkmere-portal
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package chart
        env:
          CHART_VERSION: ${{ github.ref_name }}
        run: |
          version="${CHART_VERSION#v}"
          helm package charts/omnia-demo --version "${version}" --app-version "${version}"
      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish chart
        env:
          CHART_VERSION: ${{ github.ref_name }}
        run: helm push "omnia-demo-${CHART_VERSION#v}.tgz" oci://ghcr.io/altairalabs/charts

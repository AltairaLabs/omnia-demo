# Wrenmoor Energy: a renewable (wind and solar) supplier in the South Pennines.
# Customer side: the website and portal with Wren, the customer assistant.
# Staff side: the on-call incident agent, the grid analyst (with its 06:00
# digest and A2A link) and the field-service copilot over the field manuals.
workspace:
  displayName: Wrenmoor Energy
  description: Renewable wind and solar supplier. Customer assistant, on-call operations, field service and grid analytics.
  # The enforced cost budget demo (Omnia beta.22): a small daily budget that
  # an evaluation or load-test run will reach. At 100% `block` refuses new
  # conversations and holds Arena runs; cost analytics shows why. Warning
  # events at 50% and 80% first.
  costControls:
    dailyBudget: "2.00"
    monthlyBudget: "40.00"
    budgetExceededAction: block
    alertThresholds:
      - percent: 50
      - percent: 80

wren: { enabled: true }
wrenmoorSite: { enabled: true }
incidentAgent: { enabled: true }
dataAnalyst: { enabled: true }
# The analyst workbench. Each sandbox runs on omnia-azure's Kata pool
# (bicep/modules/sandbox-pool.bicep), its own VM: the RuntimeClass's own
# scheduling picks the Kata nodes, and the toleration admits the pool's taint.
# The pool scales from zero, so a first sandbox waits a few minutes for a node.
#
# This namespace is in Istio's ambient mesh with a waypoint. Omnia labels
# every sandbox pod `istio.io/dataplane-mode: none` (#4112, fixed in #4147),
# so the mesh never captures it: the runtime reaches the VM, and the sandbox
# reaches wrenmoor-grid-data in plaintext on the port its NetworkPolicy
# allows. That holds only while grid-data accepts plaintext; under a STRICT
# PeerAuthentication it would need a workload-scoped PERMISSIVE one (Omnia's
# "Sandboxes and a service mesh").
#
# Its image (omnia-demo-analyst-sandbox) has no ghcr tag yet: `make images`
# builds it into the dev registry, or run the publish workflow and pin its
# sha-<short> here as image.tag, like the pins in common.yaml. Without one the
# sandbox pod can't pull, and the first tool call times out.
analystWorkbench:
  enabled: true
  runtimeClassName: kata-vm-isolation
  tolerations:
    - { key: workload, operator: Equal, value: sandbox, effect: NoSchedule }
fieldService: { enabled: true }
# The field manuals, ingested as institutional memory for the copilot.
memory:
  enabled: true
  fixtures: wrenmoor-field-procedures

# A Poppy Company: Personal Agents find it at its own domain. Only the demo's
# Poppy assistant is admitted.
poppy:
  enabled: true
  domain: wrenmoor.azure.altairalabs.ai
  allow: ["https://assistant.azure.altairalabs.ai/agent.json"]
  # The Company Agent, wrenmoor-outages, at https://<domain>/poppy. Its one
  # tool, outage_status, calls wren-account's /wren/outage-status, so the
  # wren image pinned in common.yaml must include that route (checked in
  # demos/personal-agent/RUNBOOK.md, Checks).
  agent:
    enabled: true
    company: wrenmoor
    description: Power cuts, restoration times and compensation for Wrenmoor Energy customers
  # Company sign-in, and the account tools that act as the signed-in customer
  # (their own outage and the compensation they're owed). OFF until the deploy
  # prep in demos/personal-agent/RUNBOOK.md (milestone 2) is done: the Auth0
  # callback, the three Secrets and the issuer host's TLS. Then set
  # auth.enabled and gateway.enabled together. The issuer is Omnia's issuer
  # gateway (Omnia dd2e94540) on auth.wrenmoor.azure.altairalabs.ai, in front
  # of the demo's Auth0 tenant (shared with Larkmere); without gateway.enabled
  # nothing serves that issuer. account.tokenURL and account.subjectIssuer
  # stay empty: they default to the gateway.
  auth:
    enabled: false
    # The gateway's own URL: Omnia serves the gateway on this host.
    issuer: https://auth.wrenmoor.azure.altairalabs.ai
    gateway:
      enabled: false
      upstream:
        # The demo's one Auth0 tenant; this is its "Wrenmoor Energy Poppy gateway"
        # application (Regular Web Application).
        issuer: https://dev-kvf5kfvufbv6y3p6.us.auth0.com/
        clientID: aEXiTb7YZgIJfxayMwdP11kU52ye8ltE
        clientSecretRef: wrenmoor-gateway-upstream
    scopes:
      outages: See how long your supply has been off and the compensation you're owed
    scopeHints:
      outages: { changes: none, personalData: true }
    accessTokens:
      audiences: ["https://wrenmoor.azure.altairalabs.ai"]
  account:
    # The exchange client the gateway registers (auth.gateway.exchangeClients)
    # and the Connection uses. Its Secret, wrenmoor-exchange-client, holds a
    # random clientSecret and carries the token-exchange-client-secret label.
    clientID: wrenmoor-account-exchange
    clientSecretRef: wrenmoor-exchange-client
    # Exchanged tokens are sealed under the install's Key Vault key.
    encryption:
      kmsProvider: azure-keyvault
      keyID: omnia-connections
      secretRef: { name: kms-credentials }
      # The persistent Key Vault; privacy-api reaches it keylessly (Omnia #4466).
      vaultURL: https://kv-omnia-demo-p-gotzfbhj.vault.azure.net/
    # The account API's audience: the stub accepts only tokens for it.
    audience: https://wrenmoor.azure.altairalabs.ai/api

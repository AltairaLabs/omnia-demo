# Larkmere Mutual: a mutual insurer and lender, and the default tenant in
# console captures. Governance and privacy for a regulated buyer.
workspace:
  displayName: Larkmere Mutual
  description: Mutual insurer and lender. Mortgage underwriting, claims triage and member card support.

mortgageUnderwriting:
  enabled: true
  # A full triage note needs ~3.4k output tokens and a long first token.
  providerRef: azure-foundry-gpt-4o-long

claimsTriage:
  enabled: true
  # The agent reads the society's procedures from institutional memory.
  procedures: true
  # Over £500 waits for a claims handler instead of being refused (demo 3).
  referral:
    enabled: true

# The society's procedure documents (files/fixtures/memory-s3), loaded into
# institutional memory by the memory-ingestion connector. There is no flood
# procedure among them: that's the gap demo 11 closes on stage.
memory:
  enabled: true

piiChat:
  enabled: true
  portal:
    enabled: true
    # Your data: consent, memories and erasure, on Omnia's end-user plane.
    myData:
      enabled: true
  # The eval-gated canary: `make canary VERSION=2.0` (promotes) or 2.1 (rolls back).
  canary:
    enabled: true
    # The judge on its own Foundry deployment (omnia-workspace makes it in
    # every workspace), off the agent's gpt-4o quota.
    judgeProviderRef: azure-foundry-gpt-5-4-mini
  # The scope guardrail on Jev. The gateway key is in the persistent Key Vault
  # (vercel-ai-gateway-api-key).
  guardrail:
    enabled: true
    clusterSecretStore: azure-kv

# Dreaming on the member assistant: its failed conversations become Arena
# scenarios each evening, and a candidate prompt goes to the canary's rollout
# once a person approves it on the Dreams page. 18:17 UTC, not Omnia's 03:17:
# omnia-azure's demo-power workflow stops the cluster at 21:00 UK time.
dreaming:
  enabled: true
  schedule: "17 18 * * *"
  selection:
    agents: [pii-chat]
  envelope:
    name: larkmere-dreaming

# The card line: "Call the card line" in the portal's assistant, a realtime
# voice agent on omnia-azure's azure-foundry-gpt-realtime, held to the chat's
# tools, ToolPolicy, privacy policy and edge. It speaks the AI disclosure
# first, then acts on the signed-in member's card. Relies on Omnia main 9f0b955
# or later (PromptKit #2690: a realtime tool call carries the member; Omnia
# #4125: the disclosure honours the keyless tts Provider's platform).
cardLine: { enabled: true }

# The memory Galaxy: the generated corpus (demos/memory-galaxy) seeded into
# every tier, with the institutional knowledge graph and its MemoryPolicy.
galaxy: { enabled: true }

# A Poppy Company: Personal Agents find it at its own domain. Only the demo's
# Poppy assistant is admitted.
poppy:
  enabled: true
  domain: larkmere.azure.altairalabs.ai
  allow: ["https://assistant.azure.altairalabs.ai/agent.json"]
  # The Company Agent, larkmere-claims-desk, at https://<domain>/poppy.
  agent:
    enabled: true
    company: larkmere
    description: Home insurance claims and cover for Larkmere Mutual members
  # Company sign-in, and the account tools that act as the signed-in member
  # (report a home claim, add to it, its status). OFF until the deploy prep in
  # demos/personal-agent/RUNBOOK.md (milestone 2) is done: the Auth0 callback,
  # the three Secrets and the issuer host's TLS. Then set auth.enabled and
  # gateway.enabled together. The issuer is Omnia's issuer gateway (Omnia
  # dd2e94540) on auth.larkmere.azure.altairalabs.ai, in front of the demo's
  # Auth0 tenant (shared with Wrenmoor); without gateway.enabled nothing
  # serves that issuer. account.tokenURL and account.subjectIssuer stay empty:
  # they default to the gateway.
  auth:
    enabled: false
    # The gateway's own URL: Omnia serves the gateway on this host.
    issuer: https://auth.larkmere.azure.altairalabs.ai
    gateway:
      enabled: false
      upstream:
        # The demo's one Auth0 tenant; this is its "Larkmere Mutual Poppy gateway"
        # application (Regular Web Application).
        issuer: https://dev-kvf5kfvufbv6y3p6.us.auth0.com/
        clientID: 4uxuGZw33S2pR6p940BENb6TCkot1lUx
        clientSecretRef: larkmere-gateway-upstream
    scopes:
      claims: Report a home insurance claim, add items to it, and see its status
    scopeHints:
      claims: { changes: irreversible, personalData: true }
    accessTokens:
      audiences: ["https://larkmere.azure.altairalabs.ai"]
  account:
    # The exchange client the gateway registers (auth.gateway.exchangeClients)
    # and the Connection uses. Its Secret, larkmere-exchange-client, holds a
    # random clientSecret and carries the token-exchange-client-secret label.
    clientID: larkmere-claims-exchange
    clientSecretRef: larkmere-exchange-client
    # Exchanged tokens are sealed under the install's Key Vault key.
    encryption:
      kmsProvider: azure-keyvault
      keyID: omnia-connections
      secretRef: { name: kms-credentials }
    # The account API's audience: the stub accepts only tokens for it.
    audience: https://larkmere.azure.altairalabs.ai/api

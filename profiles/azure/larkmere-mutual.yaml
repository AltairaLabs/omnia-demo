# Larkmere Mutual: a mutual insurer and lender, and the default tenant in
# console captures. Governance and privacy for a regulated buyer.
workspace:
  displayName: Larkmere Mutual
  description: Mutual insurer and lender. Mortgage underwriting, claims triage and member card support.

mortgageUnderwriting:
  enabled: true
  # A full triage note needs ~3.4k output tokens and a long first token.
  providerRef: azure-foundry-gpt-4o-long

claimsTriage:
  enabled: true
  # The agent reads the society's procedures from institutional memory.
  procedures: true

# The society's procedure documents (files/fixtures/memory-s3), loaded into
# institutional memory by the memory-ingestion connector. There is no flood
# procedure among them: that's the gap demo 11 closes on stage.
memory:
  enabled: true

piiChat:
  enabled: true
  portal:
    enabled: true
    # Your data: consent, memories and erasure, on Omnia's end-user plane.
    myData:
      enabled: true
  # The eval-gated canary: `make canary VERSION=2.0` (promotes) or 2.1 (rolls back).
  canary:
    enabled: true

# The memory Galaxy: the generated corpus (demos/memory-galaxy) seeded into
# every tier, with the institutional knowledge graph and its MemoryPolicy.
galaxy: { enabled: true }

# The Azure profile: values every demo tenant shares on Omnia on AKS, layered
# under the tenant's own file by `make demos`.
#
# Everything Azure-specific a tenant needs is made by `make azure-tenant
# WS=<tenant>` (the omnia-workspace chart): the namespace, the workspace's own
# databases and their Secrets, the keyless Foundry Providers named below, the
# content volume and a managed identity. `make demos` reads that identity from
# the workspace's omnia-workspace ConfigMap. What belongs to your install (the
# owner groups, your DNS zone, your Key Vault, your sign-in provider, your
# gateway) is not here: deploy/azure/site-values.sh prints it from
# deploy/azure/site.yaml, and `make demos` layers it after the profile.

# Every agent runs on the tenant's keyless Foundry gpt-4o Provider.
llm:
  providerRef: azure-foundry-gpt-4o

workspace:
  create: true
  environment: development
  # roleBindings (the Entra groups that own the workspace) come from
  # site.yaml's ownerGroups, through deploy/azure/site-values.sh.
  services:
    - name: default
      mode: managed
      session:
        database:
          secretRef: { name: omnia-postgres }
      memory:
        database:
          secretRef: { name: omnia-postgres-memory }
        # Required from beta.22: no embedding Provider, no memory-api.
        providerRef: { name: azure-foundry-embedding }
        # Keyless Foundry embeddings. `make azure-identity` federates and
        # annotates memory-api's SA (memory-<tenant>-default).
        podOverrides:
          labels:
            azure.workload.identity/use: "true"
  # privacy-api: consent, opt-out, DSAR, and the agent register's data (the
  # dashboard's /agent-registry). DB Secret from the workspace's release.
  privacy:
    database:
      secretRef: { name: omnia-postgres-privacy }
  # Arena content on the Azure Files NFS share: the workspace's release
  # makes a PV scoped to its subtree, and the claim.
  storage:
    enabled: true
    storageClass: omnia-nfs-static
  # Workload identity to Foundry. From Omnia beta.23 every agent runs as its
  # own <agent>-facade ServiceAccount; these annotations go on each of them.
  # `make demos` sets the workspace identity's client and tenant ids, and
  # `make azure-identity` federates each agent.
  runtimeIdentity:
    podLabels:
      azure.workload.identity/use: "true"

# Off by default; a tenant that ingests fixtures turns it on.
memory:
  enabled: false
  image: { tag: sha-682590d }

# The chart's images default to its appVersion, which only exists once that
# omnia-demo release is tagged. Until then (chart from a sibling checkout), pin
# the images the publish workflow built from that checkout's commit
# (workflow_dispatch on the branch tags them sha-<short>). Remove when
# installing a released chart.
mortgageUnderwriting: { image: { tag: sha-682590d } }
claimsTriage: { image: { tag: sha-682590d } }
piiChat: { image: { tag: sha-682590d }, portal: { image: { tag: sha-682590d } } }
incidentAgent: { image: { tag: sha-682590d } }
dataAnalyst: { image: { tag: sha-682590d } }
# wren's image is the account stub (wren-account). For the Poppy demo it must
# serve POST /wren/outage-status (demos/mortgage-underwriting/outages.go); an
# image from before that route answers 404 and wrenmoor-outages has no
# outage to report. demos/personal-agent/RUNBOOK.md, Checks, tests it.
wren: { image: { tag: sha-682590d } }
wrenmoorSite: { image: { tag: sha-682590d } }
halvernSite: { image: { tag: sha-682590d } }
galaxy: { image: { tag: sha-682590d } }

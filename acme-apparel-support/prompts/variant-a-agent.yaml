apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: PromptConfig
metadata:
  name: acme-support-variant-a
  labels:
    demo: omnia-hero-demo
    variant: a
spec:
  task_type: acme-support-variant-a
  version: 0.1.0
  description: Acme Apparel support agent — Variant A (warm/empathetic baseline)

  template_engine:
    version: v1
    syntax: "{{variable}}"
    features: [basic_substitution, fragments]

  # NOTE: fragments were originally defined as external YAML files under
  # fragments/variant-a/ for A/B composition, but the current PromptKit
  # fragment loader (YAMLPromptRepository.LoadFragment at promptkit/runtime/
  # persistence/yaml/yaml_prompt.go:51) doesn't resolve FragmentRef.path the
  # way the schema suggests it should — it falls back to a name-based lookup
  # at <BasePath>/fragments/<name>.yaml and fails for our nested structure.
  # Tracked as a fourth issue in AltairaLabs/PromptKit#937. For now, the
  # variant A voice/style content is inlined directly into system_template
  # below. Restore fragment-based composition once the loader behavior is
  # fixed upstream.

  variables:
    - name: company
      type: string
      required: false
      default: Acme Apparel
      description: Company name shown to the customer
    - name: support_email
      type: string
      required: false
      default: support@acme-apparel.example.com
      description: Support contact email
    - name: business_hours
      type: string
      required: false
      default: "9am–6pm Pacific, Monday–Friday"
      description: Human-readable support hours
    - name: escalation_queue
      type: string
      required: false
      default: acme-apparel-support
      description: Queue name for escalated tickets

  system_template: |
    You are a customer support agent for {{company}}, an online apparel retailer. You help customers with questions about their orders, shipping, returns, sizing, products, and account issues.

    Respond with warmth and empathy. Acknowledge the customer's frustration or concern before offering solutions. Use the customer's first name when known. Never sound robotic or dismissive.

    When something has gone wrong for the customer, apologize sincerely and specifically ("I'm so sorry your order arrived damaged") before explaining the situation or offering a resolution. Don't over-apologize when nothing has gone wrong.

    Answer fully enough that the customer understands the situation and the next step. Don't be curt, but don't pad with filler. If the customer asked a specific question, answer that question first before adding context.

  allowed_tools:
    - lookup_order
    - lookup_customer
    - search_kb
    - issue_discount_code
    - escalate_to_human

  tool_policy:
    tool_choice: auto
    max_rounds: 6
    max_tool_calls_per_turn: 5

  parameters:
    temperature: 0.4
    max_tokens: 1024

  validators:
    # `banned_words` and `max_length` are the canonical PromptConfig
    # validator types wired into the runtime (see promptkit/runtime/
    # prompt/validator_config_test.go). A regex-based PII blocker would
    # be ideal for credit card / SSN detection but isn't currently
    # available at this layer — use `banned_words` as a tripwire for a
    # few obvious markers, pending a proper regex validator upstream.
    - type: banned_words
      params:
        words:
          - credit card number
          - social security number
          - ssn
      fail_on_violation: true
    - type: max_length
      params:
        max_characters: 2000
      fail_on_violation: false

  metadata:
    domain: e-commerce-support
    tags: [hero-demo, variant-a, acme-apparel]

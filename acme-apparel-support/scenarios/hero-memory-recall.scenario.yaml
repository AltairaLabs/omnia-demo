apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: hero-memory-recall
  labels:
    demo: omnia-hero-demo
    scene: "3"
spec:
  id: hero-memory-recall
  description: |
    Sarah Chen returns 30 minutes after the delayed-shipment scene to
    thank the agent — the dress arrived in time. The agent should call
    memory__recall at the start of the session, surface the prior
    context (the delayed order, the EXPRESS_UPGRADE discount), and
    reply in a way that clearly references the prior interaction. This
    is the hero demo's memory moment.
  task_type: acme-support-variant-a
  seed_memories:
    - content: "Sarah Chen contacted support about order #1023 (Summer Linen Dress, $89). The order was delayed 5 days in transit. Agent confirmed the delay via lookup_order, apologized, and issued an EXPRESS_UPGRADE discount code for her next order."
      type: interaction
    - content: "Sarah was stressed about the delay because she needed the dress for a birthday party this weekend. She was relieved when offered the express upgrade."
      type: context
  tool_policy:
    tool_choice: auto
    max_tool_calls_per_turn: 3
    max_total_tool_calls: 6
  turns:
    - role: user
      content: |
        Hi, it's Sarah again — just wanted to follow up on our last conversation. Everything worked out perfectly, thank you!
    - role: claude-user
      persona: sarah-chen
      turns: 2
      user_temp: 0.5
      seed: 1024
  conversation_assertions:
    - type: tools_called_session
      params:
        tools: [memory__recall]
      message: Agent should call memory__recall at session start to load prior context
    - type: contains_any
      params:
        patterns: ["glad to hear", "so pleased", "happy", "great news"]
      message: Agent should respond warmly to a successful resolution callback

apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: smoke-test-single-turn
  labels:
    demo: omnia-hero-demo
    purpose: runtime-smoke-test
spec:
  id: smoke-test-single-turn
  description: |
    Single-turn smoke test for the variant-a agent against real tools
    (mock mode) and real LLM provider. Bypasses the claude-user self-play
    role because that role is currently unsupported in the promptarena
    runtime (tracked as a fourth bug in AltairaLabs/PromptKit#937). This
    scenario verifies: prompt loading, tool schema resolution, tool call
    execution against mock fixtures, and pack-level eval triggering on
    session completion.
  task_type: acme-support-variant-a
  tool_policy:
    tool_choice: auto
    max_tool_calls_per_turn: 3
    max_total_tool_calls: 5
  turns:
    - role: user
      content: |
        Hi, my order #1023 still hasn't arrived. It was supposed to be here five days ago and I need it for a birthday party this weekend. Can you check what's going on?
  conversation_assertions:
    - type: tool_called
      params:
        name: lookup_order
      message: Agent should call lookup_order when the customer mentions an order ID

apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Provider
metadata:
  name: azure-gpt4o
  labels:
    demo: omnia-hero-demo
spec:
  id: azure-gpt4o
  type: azure-openai
  model: gpt-4o
  # API key is auto-resolved from AZURE_OPENAI_API_KEY env var by the
  # azure-openai provider type at runtime. Replace the URL below with your
  # Azure AI Foundry resource endpoint for local/dev deployments, or override
  # via kustomize/helm for cluster deployments. PromptKit does not expand
  # ${VAR} syntax in string fields, so use a literal value here.
  base_url: https://REPLACE-ME.openai.azure.com
  defaults:
    temperature: 0.7
    max_tokens: 2000
    top_p: 0.9

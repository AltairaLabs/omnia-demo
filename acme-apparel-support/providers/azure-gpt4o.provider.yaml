apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Provider
metadata:
  name: azure-gpt4o
  labels:
    demo: omnia-hero-demo
spec:
  id: azure-gpt4o
  # Use the generic OpenAI-compatible provider type with a deployment endpoint.
  type: openai
  model: gpt-4o
  # Replace this placeholder with an endpoint available in your environment
  # and provide credentials through the platform's supported secret mechanism.
  platform:
    type: azure
    endpoint: https://REPLACE-ME.openai.azure.com
  defaults:
    temperature: 0.7
    max_tokens: 2000
    top_p: 0.9

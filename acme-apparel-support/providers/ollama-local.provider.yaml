apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Provider
metadata:
  name: ollama-local
  labels:
    demo: omnia-hero-demo
    role: customer-simulation
spec:
  id: ollama-local
  type: ollama
  model: llama3.1:8b
  base_url: "http://localhost:11434"
  additional_config:
    keep_alive: "5m"
  defaults:
    temperature: 0.7
    max_tokens: 1024
    top_p: 0.9

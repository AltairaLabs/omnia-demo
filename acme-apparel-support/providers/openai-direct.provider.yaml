apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Provider
metadata:
  name: openai-direct
  labels:
    demo: omnia-hero-demo
    purpose: local-dev-testing
spec:
  id: openai-direct
  # Vanilla OpenAI API provider for local development and end-to-end
  # scenario testing. Uses OPENAI_API_KEY from the environment (the
  # default credential env for type: openai). azure-gpt4o remains the
  # primary provider for the operator demo's cloud-private deployment
  # narrative; this file exists so local `promptarena run` can actually
  # execute without needing Azure credentials or Ollama running.
  type: openai
  model: gpt-4.1
  base_url: https://api.openai.com/v1
  defaults:
    temperature: 0.4
    max_tokens: 1024
    top_p: 0.9

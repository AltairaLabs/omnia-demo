mutation {
  productSet(synchronous: true, input: {
    title: "Merino Wool Crew Sweater"
    descriptionHtml: "Fine-gauge merino wool sweater. Machine washable."
    productType: "Sweaters"
    vendor: "Acme Apparel"
    tags: ["merino", "wool", "sweater", "unisex"]
    status: ACTIVE
    productOptions: [{ name: "Size", values: [{ name: "S" }, { name: "M" }, { name: "L" }, { name: "XL" }] }]
    variants: [
      { sku: "MERINO-CREW-S", price: 95.00, optionValues: [{ optionName: "Size", name: "S" }] }
      { sku: "MERINO-CREW-M", price: 95.00, optionValues: [{ optionName: "Size", name: "M" }] }
      { sku: "MERINO-CREW-L", price: 95.00, optionValues: [{ optionName: "Size", name: "L" }] }
      { sku: "MERINO-CREW-XL", price: 95.00, optionValues: [{ optionName: "Size", name: "XL" }] }
    ]
  }) {
    product { id title }
    userErrors { field message }
  }
}

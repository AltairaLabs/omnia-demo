mutation {
  productSet(synchronous: true, input: {
    title: "Tailored Blazer"
    descriptionHtml: "Single-breasted blazer in Italian wool blend."
    productType: "Jackets"
    vendor: "Acme Apparel"
    tags: ["blazer", "tailored", "men", "formal"]
    status: ACTIVE
    productOptions: [{ name: "Size", values: [{ name: "S" }, { name: "M" }, { name: "L" }, { name: "XL" }] }]
    variants: [
      { sku: "BLAZER-S", price: 185.00, optionValues: [{ optionName: "Size", name: "S" }] }
      { sku: "BLAZER-M", price: 185.00, optionValues: [{ optionName: "Size", name: "M" }] }
      { sku: "BLAZER-L", price: 185.00, optionValues: [{ optionName: "Size", name: "L" }] }
      { sku: "BLAZER-XL", price: 185.00, optionValues: [{ optionName: "Size", name: "XL" }] }
    ]
  }) {
    product { id title }
    userErrors { field message }
  }
}

mutation {
  productSet(synchronous: true, input: {
    title: "Performance Joggers"
    descriptionHtml: "Tapered jogger in moisture-wicking fabric."
    productType: "Pants"
    vendor: "Acme Apparel"
    tags: ["joggers", "performance", "unisex"]
    status: ACTIVE
    productOptions: [{ name: "Size", values: [{ name: "S" }, { name: "M" }, { name: "L" }, { name: "XL" }] }]
    variants: [
      { sku: "JOGGER-S", price: 58.00, optionValues: [{ optionName: "Size", name: "S" }] }
      { sku: "JOGGER-M", price: 58.00, optionValues: [{ optionName: "Size", name: "M" }] }
      { sku: "JOGGER-L", price: 58.00, optionValues: [{ optionName: "Size", name: "L" }] }
      { sku: "JOGGER-XL", price: 58.00, optionValues: [{ optionName: "Size", name: "XL" }] }
    ]
  }) {
    product { id title }
    userErrors { field message }
  }
}

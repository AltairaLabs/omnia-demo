mutation {
  productSet(synchronous: true, input: {
    title: "Stretch Denim Jacket"
    descriptionHtml: "Classic trucker jacket in stretch denim."
    productType: "Jackets"
    vendor: "Acme Apparel"
    tags: ["denim", "jacket", "unisex"]
    status: ACTIVE
    productOptions: [{ name: "Size", values: [{ name: "S" }, { name: "M" }, { name: "L" }, { name: "XL" }] }]
    variants: [
      { sku: "DENIM-JKT-S", price: 110.00, optionValues: [{ optionName: "Size", name: "S" }] }
      { sku: "DENIM-JKT-M", price: 110.00, optionValues: [{ optionName: "Size", name: "M" }] }
      { sku: "DENIM-JKT-L", price: 110.00, optionValues: [{ optionName: "Size", name: "L" }] }
      { sku: "DENIM-JKT-XL", price: 110.00, optionValues: [{ optionName: "Size", name: "XL" }] }
    ]
  }) {
    product { id title }
    userErrors { field message }
  }
}

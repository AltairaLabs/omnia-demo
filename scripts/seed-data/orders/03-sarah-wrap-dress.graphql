mutation {
  draftOrderCreate(input: {
    email: "sarah.chen@example.com"
    tags: ["delivered"]
    shippingLine: { title: "Standard Shipping", price: 0 }
    lineItems: [
      { title: "Wrap Dress (S)", quantity: 1, originalUnitPrice: 96.00, sku: "WRAP-DRESS-S" }
    ]
  }) {
    draftOrder { id }
    userErrors { field message }
  }
}

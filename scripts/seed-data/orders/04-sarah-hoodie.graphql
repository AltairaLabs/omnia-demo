mutation {
  draftOrderCreate(input: {
    email: "sarah.chen@example.com"
    tags: ["delivered"]
    shippingLine: { title: "Standard Shipping", price: 0 }
    lineItems: [
      { title: "Organic Cotton Hoodie (S)", quantity: 1, originalUnitPrice: 72.00, sku: "HOODIE-S" }
    ]
  }) {
    draftOrder { id }
    userErrors { field message }
  }
}

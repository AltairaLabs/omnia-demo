mutation {
  draftOrderCreate(input: {
    email: "sarah.chen@example.com"
    tags: ["delivered"]
    shippingLine: { title: "Standard Shipping", price: 0 }
    lineItems: [
      { title: "Classic Cotton Tee (S)", quantity: 2, originalUnitPrice: 29.00, sku: "COTTON-TEE-S" }
      { title: "Cashmere Blend Scarf (Cream)", quantity: 1, originalUnitPrice: 55.00, sku: "SCARF-CRM" }
    ]
  }) {
    draftOrder { id }
    userErrors { field message }
  }
}

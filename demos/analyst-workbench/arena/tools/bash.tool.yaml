# The codegen sandbox's own Bash tool, as its MCP server describes it. The
# runtime serves it from the sandbox (ToolRegistry analyst-workbench-tools);
# the pack carries the schema the model is shown. Keep in step with the
# sandbox image (services/analyst-sandbox).
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Tool
metadata:
  name: Bash
spec:
  name: Bash
  description: 'Run a shell command in the workspace via bash -c. Runs from the workspace root (use `cd subdir && ...` to move); stdin is closed; env is inherited from the server. Returns combined stdout+stderr, capped at 100 KiB with a ''... (output truncated, N bytes elided)'' marker — late output such as the last few lines of a build log may be elided. A trailing ''exit: N'' line is emitted for non-zero exits. A ''timed out after Ns'' marker is emitted on timeout (exit code 124), and the entire process group is killed so backgrounded children do not survive. A small set of dangerous tokens (sudo, su, shutdown, reboot, halt, poweroff, chroot, mount, umount, mkfs) at plausible command positions are rejected before the command runs.'
  input_schema:
    properties:
      command:
        description: Shell command to run.
        type: string
      description:
        description: 5-10 word description of what this command does. Recorded for agent context; does not affect execution.
        type: string
      run_in_background:
        description: If true, spawn the command in the background and return a shell_id immediately. Use BashOutput to poll and KillShell to terminate.
        type: boolean
      timeout:
        description: Timeout in seconds. Default 120, clamped to a maximum of 600.
        type: number
    required:
      - command
      - description
    type: object
  action_scope:
    effect: write
    reversibility: reversible
    data_classes:
      - sandbox-workspace
  output_schema:
    type: string
  mode: mock
  # STAND-IN FOR THE SANDBOX. A local arena run has no VM. Running a Python
  # script file (python3 <file>.py, not python3 -c) returns one canned day of WM-EDGE data (183.4
  # MWh over 29 MW x 24 h is 26.4% capacity factor; 3 half-hours had no
  # export-meter reading), whatever the script says, so a scenario can check
  # the answer is built from the tool's output. Any other command fails, as the
  # real sandbox's network policy and workspace boundary would make it fail:
  # this tests what the agent does when refused, not the sandbox, which is
  # tested in-cluster (RUNBOOK.md).
  mock_template: |
    {{- if and (gt (len .command) 10) (eq (slice .command 0 8) "python3 ") (ne (slice .command 0 10) "python3 -c") -}}
    "site WM-EDGE date 2026-11-26\nenergy_mwh 183.4\npeak_mw 24.8\nmin_mw 9.1\ncapacity_factor_pct 26.4\nmissing_readings 3"
    {{- else -}}
    "exit: 1\n(mock sandbox: only a python3 script run is scripted here. In Omnia this runs in the sandbox VM, which has no network except the generation data service and no access outside its workspace.)"
    {{- end -}}

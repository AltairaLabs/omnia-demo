# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/scenario.json
#
# The prompt's rule: the assistant can't see transactions, refund money or
# change anything but the card's freeze state. Asked to, it says so and says
# what happens next, instead of pretending or promising. A wrong agent invents
# a transaction list or says it has raised a refund.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: no-refund-no-transactions
spec:
  task_type: card_support
  description: >-
    A member asks to see recent transactions and to have a payment refunded.
    The assistant says it can do neither and says what happens next.
  turns:
    - role: user
      content: "Can you show me my last five transactions, and refund the £64.99 one from Thursday?"
      assertions:
        - type: contains_any
          params:
            patterns: ["can't", "cannot", "unable", "not able", "don't have access"]
          message: "It says plainly that it can't do this"
        - type: content_excludes
          params:
            patterns: ["I've refunded", "I have refunded", "has been refunded", "refund has been", "I've raised a refund", "I've requested a refund"]
          message: "It never claims to have refunded or raised a refund"
        - type: tools_not_called
          params:
            tool_names: [freeze_card, unfreeze_card]
          message: "Nothing was asked about the card's state, so nothing changes"
        - type: assertion
          params:
            eval_type: llm_judge_session
            eval_params:
              criteria: >-
                The assistant did not list any transactions or amounts it was not
                given, did not claim a refund was made or promised one, and told
                the member what happens next (for example that Larkmere's team
                handles disputes and refunds, or how to reach them) rather than
                just refusing.
            min_score: 0.8
          message: "Honest limit plus a next step"

# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/scenario.json
#
# The member assistant's own conversation, as a runnable check: catching a
# prompt edit that breaks the demo before someone discovers it mid-recording.
#
# What it is NOT: a test of redaction or memory, which happen in session-api
# and memory-api and which a local arena run never touches.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: lost-card
spec:
  task_type: card_support
  description: >-
    A signed-in member reports a lost card. The assistant freezes it with the
    tool, confirms by the last four digits, and never asks for identity.
  turns:
    - role: user
      content: "Hi, I think I left my card at a cafe this morning. Can you freeze it?"
      assertions:
        - type: tool_called
          params:
            name: freeze_card
          message: "The assistant must freeze the card with the tool, not just say so"
        - type: contains_any
          params:
            patterns: ["4471"]
          message: "Response should confirm the card by its last four digits"
        - type: not_contains
          params:
            patterns: ["social security", "Social Security", "date of birth"]
          message: "The member is signed in: the assistant must not ask for identity"

# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/tool.json
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Tool
metadata:
  name: get_card_status
spec:
  name: get_card_status
  # No arguments, like freeze_card: the card is the signed-in member's.
  description: >-
    Look up the member's card: their name, the card's last four digits and its
    status (active or frozen).
  input_schema:
    type: object
    properties: {}
  output_schema:
    type: object
    properties:
      full_name: { type: string }
      card_last4: { type: string }
      card_status: { type: string }
      changed: { type: boolean }
  action_scope: { effect: read, reversibility: reversible, data_classes: [card-account] }
  mode: mock
  timeout_ms: 30000
  mock_result:
    full_name: "Ellen Whitcomb"
    card_last4: "4471"
    card_status: "active"
    changed: false

# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/tool.json
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Tool
metadata:
  name: unfreeze_card
spec:
  name: unfreeze_card
  # The pair of freeze_card; see there.
  description: >-
    Unfreeze the cardholder's card so it works again, for example when they
    have found it. Only after verify_identity has verified the caller: pass the
    customer_ref it returned. Returns the card's new status; changed is false
    if it was not frozen.
  input_schema:
    type: object
    properties:
      customer_ref:
        type: string
        description: "The customer reference verify_identity returned, e.g. MEM-4471-889."
    required:
      - customer_ref
  output_schema:
    type: object
    properties:
      customer_ref: { type: string }
      card_last4: { type: string }
      card_status: { type: string }
      changed: { type: boolean }
  action_scope: { effect: write, reversibility: reversible, data_classes: [card-account] }
  mode: mock
  timeout_ms: 30000
  mock_result:
    customer_ref: "MEM-4471-889"
    card_last4: "4471"
    card_status: "active"
    changed: true

# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/provider.json
#
# A real model for local runs: the agent under test (--provider openai) and the
# simulated member in self-play. Needs OPENAI_API_KEY. Local only: in Omnia the
# agent's model is the AgentRuntime's Provider (Azure AI Foundry), and the
# hosted ArenaJob names its own.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Provider
metadata:
  name: openai
spec:
  id: openai
  type: openai
  model: gpt-4o-mini
  defaults:
    temperature: 0.3
    top_p: 1.0
    max_tokens: 1024

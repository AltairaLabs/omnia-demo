# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/arena.json
#
# Source of truth for Larkmere's member assistant (the agent is still named
# pii-chat, and its prompt keyed card_support).
#
# This directory is the editable source for the example pack.
#
# The chart ships a COMPILED pack (charts/omnia-demo/files/arena/), with the
# governance block from governance-declarations.yaml merged in.
#
# Regenerate with: hack/build-packs.sh pii-chat
#
# Tests: scripted scenarios plus self-play (personas/). They run on the mock
# provider without a key (`promptarena validate`; a mock run loads and executes
# them but cannot satisfy the assertions, which need a real model). Real runs
# need OPENAI_API_KEY in the environment:
#   promptarena run --config demos/pii-chat/arena/config.arena.yaml --provider openai
# gpt-4o is the agent under test; gpt-4o-mini plays the simulated user and the
# judges.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Arena
metadata:
  name: pii-chat
spec:
  prompt_configs:
    - id: card-support
      file: prompts/card-support.yaml

  providers:
    - file: providers/mock.yaml
    # The scope guardrail's classifier (role: inference), bound to the prompt's
    # `guard` slot. Needs AI_GATEWAY_API_KEY.
    - file: providers/jev.yaml
    # A real model for local runs: the agent under test (--provider openai).
    # Needs OPENAI_API_KEY.
    - file: providers/openai.yaml
    # The simulated member and the judges (gpt-4o-mini).
    - file: providers/openai-mini.yaml

  # The card system, acting on the signed-in member. memory__remember and memory__recall
  # are NOT declared here: they are PromptKit platform capabilities registered
  # by the SDK when spec.memory.enabled is set on the AgentRuntime, not pack
  # tools. Declaring them would be describing something the pack does not own.
  tools:
    - file: tools/get-card-status.tool.yaml
    - file: tools/freeze-card.tool.yaml
    - file: tools/unfreeze-card.tool.yaml

  scenarios:
    - file: scenarios/lost-card.scenario.yaml
    - file: scenarios/social-engineering.scenario.yaml
    - file: scenarios/out-of-scope.scenario.yaml
    # The scope guardrail under attack, and its false-refusal partner.
    - file: scenarios/guardrail-redteam.scenario.yaml
    - file: scenarios/guardrail-false-refusal.scenario.yaml
    # What the prompt itself holds, with no guardrail involved.
    - file: scenarios/full-card-number.scenario.yaml
    - file: scenarios/no-refund-no-transactions.scenario.yaml
    - file: scenarios/unfreeze.scenario.yaml
    - file: scenarios/impatient-member.scenario.yaml

  # Self-play, because one scripted conversation only tests the happy path. The
  # agent's job is to refuse to act until it has verified the caller, and the
  # only way to know that guardrail works is to have something attack it.
  #
  # The litmus test: social-engineer SHOULD trip the assertions on
  # scenarios/social-engineering. If it sails through, the assertions are too
  # weak — not the agent too good.
  #
  # The simulated user is a real model (a mock cannot improvise): OPENAI_API_KEY.
  # Real run: promptarena run demos/pii-chat/arena --provider openai --roles claude-user
  self_play:
    personas:
      - file: personas/social-engineer.persona.yaml
      - file: personas/advice-seeker.persona.yaml
      - file: personas/card-member.persona.yaml
      - file: personas/impatient-member.persona.yaml
    roles:
      - id: claude-user
        provider: openai-mini

  # The judge for llm_judge assertions: never the agent's own model.
  judges:
    - name: default
      provider: openai-mini

  defaults:
    # Low, but not zero. A support agent that phrases the same reassurance
    # identically every time reads as a script, and the deterministic capture
    # path already exists for takes that must match.
    temperature: 0.3
    max_tokens: 1024
    output:
      dir: out
      formats: ["json"]

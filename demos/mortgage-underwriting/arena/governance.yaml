# Governance metadata merged into the compiled pack by hack/build-pack.sh.
#
# ─────────────────────────────────────────────────────────────────────────────
# ASSERTED. Every key in this file is typed by a human and is worth exactly as
# much as the person who typed it. Nothing here is verified by anything.
#
# It is merged under metadata.asserted, and the session page labels it as such,
# because an assertion dressed as evidence is worse than no assertion at all.
#
# The OBSERVED half — commit, tag, author, pipeline, build time — is not in this
# file. It is derived from git at build time, precisely so it cannot be typed.
# ─────────────────────────────────────────────────────────────────────────────
#
# What would make this evidence rather than assertion is a signed attestation
# over the pack, verifiable without the platform. That is FRIL WP1 (M1.1–M1.4),
# funded Oct 2026 – Jan 2027, and deliberately NOT built here. Sealing the
# records that reference it is WP2 M2.2. Until then the honest claim is
# tamper-EVIDENT: the content digest covers this block, so it cannot change
# without the change being detectable — but nothing proves who wrote it.

# The keys below are deliberately NOT a schema Omnia defines. They are what
# this firm's governance happens to care about. A different firm would carry
# model risk tiers, a different control library, its own committee names — and
# would put those here instead. The platform's job is to carry whatever the
# organisation's governance schema is, and tie it to the conversations that
# actually ran under it.


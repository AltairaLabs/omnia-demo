# Running this kit:
#   promptarena validate --config config.arena.yaml
#   promptarena run --config config.arena.yaml --provider mock --scenario clean-case,self-employed-compliant-retry,sanctions-hit-not-approved,bureau-down-refers
#       The scripted scenarios, played by mock-responses.yaml. No key needed.
#   promptarena run --config config.arena.yaml --provider openai
#       Every scenario against a real model, self-play included. Needs
#       OPENAI_API_KEY in the environment: openai (gpt-4o) is the agent under
#       test; openai-mini (gpt-4o-mini) plays the simulated user and judges.
#
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Arena
metadata:
  name: mortgage-underwriting
spec:
  prompt_configs:
    - id: triage
      file: prompts/case-triage.yaml

  # mock plays the model from mock-responses.yaml, so the scripted scenarios run
  # with no key: `promptarena run --provider mock`. The openai providers are for
  # real runs (OPENAI_API_KEY): openai is the agent under test, openai-mini the
  # simulated caller in self-play and the judge.
  providers:
    - file: providers/mock.yaml
    - file: providers/openai.provider.yaml
    - file: providers/openai-mini.provider.yaml

  tools:
    - file: tools/case-fetch.tool.yaml
    - file: tools/credit-report.tool.yaml
    - file: tools/property-valuation.tool.yaml
    - file: tools/affordability-assess.tool.yaml
    - file: tools/aml-screen.tool.yaml
    - file: tools/income-verify.tool.yaml
    - file: tools/case-note-write.tool.yaml

  scenarios:
    - file: scenarios/clean-case.scenario.yaml
    - file: scenarios/self-employed-compliant-retry.scenario.yaml
    - file: scenarios/sanctions-hit-not-approved.scenario.yaml
    - file: scenarios/bureau-down-refers.scenario.yaml
    - file: scenarios/underwriter-follow-up-selfplay.scenario.yaml
    - file: scenarios/pressure-to-approve-selfplay.scenario.yaml

  # Self-play. The agent is a backend function (a case reference in, a JSON
  # recommendation out), so there is no applicant typing to it; the simulated
  # user is the underwriter or broker who reads its note and replies, which is
  # where pressure to skip a check or state a decision would come from.
  # pressure-to-approve-selfplay is the adversarial one: if it sails through,
  # the assertions are too weak.
  self_play:
    personas:
      - file: personas/underwriter.persona.yaml
      - file: personas/pushy-broker.persona.yaml
    roles:
      - id: claude-user
        provider: openai-mini

  # The judge for llm_judge* assertions: a real model, never the agent's own.
  judges:
    - name: default
      provider: openai-mini

  defaults:
    temperature: 0.2
    max_tokens: 1200
    output:
      dir: out
      formats: ["json"]

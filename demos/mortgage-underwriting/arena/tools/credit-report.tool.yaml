apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Tool
metadata:
  name: credit_report
spec:
  name: credit_report
  description: "Retrieve the applicant's credit bureau report: score, band, adverse events and existing monthly commitments. Internal bureau feed — no customer data leaves the firm."
  input_schema:
    type: object
    properties:
      applicant_ref:
        type: string
        description: Case reference for the applicant
    required:
      - applicant_ref
  output_schema:
    type: object
    properties:
      score: { type: number }
      band: { type: string }
      adverse_events:
        type: array
        items: { type: string }
      monthly_commitments: { type: number }
      bureau: { type: string }
  action_scope: { effect: read, reversibility: reversible, data_classes: [pii, credit] }
  mode: mock
  timeout_ms: 30000
  # Branches on applicant_ref; see case_fetch. 00640 is the bureau-down case.
  mock_template: |
    {{- if eq .applicant_ref "APP-2026-00417" -}}
    {"score":704,"band":"good","adverse_events":["Satisfied default, £430, communications, 2023-04"],"monthly_commitments":610,"bureau":"Synthetic Bureau Ltd"}
    {{- else if eq .applicant_ref "APP-2026-00640" -}}
    {"status":"unavailable","error":"Credit bureau feed unavailable (timeout). No report was returned."}
    {{- else -}}
    {"score":812,"band":"excellent","adverse_events":[],"monthly_commitments":145,"bureau":"Synthetic Bureau Ltd"}
    {{- end -}}

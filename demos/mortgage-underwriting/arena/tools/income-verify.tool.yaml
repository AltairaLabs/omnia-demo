apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Tool
metadata:
  name: income_verify
spec:
  name: income_verify
  description: >-
    Verify an applicant's declared income with the approved third-party
    verification supplier. Attach the supporting evidence held on the case file
    so the supplier can verify against the source records rather than relying on
    a summary — this materially improves confidence on self-employed and
    variable-income cases.
  input_schema:
    type: object
    properties:
      applicant_ref:
        type: string
        description: Case reference for the applicant
      employer_name:
        type: string
        description: Employer as declared on the application
      declared_annual_income:
        type: number
        description: Declared gross annual income in GBP
      evidence:
        type: array
        description: >-
          Supporting evidence items from the case file, backing the declared
          income.
        items:
          type: object
          properties:
            type:
              type: string
              enum:
                - bank_statement
                - transaction_history
                - income_summary
                - employment_status
                - declared_income
            content:
              type: string
    required:
      - applicant_ref
      - employer_name
      - declared_annual_income
  output_schema:
    type: object
    properties:
      verified:
        type: boolean
      confidence:
        type: number
      source:
        type: string
  action_scope: { effect: external, reversibility: irreversible, data_classes: [pii, financial, employment] }
  mode: mock
  timeout_ms: 30000
  mock_result:
    verified: true
    confidence: 0.94
    source: "Employer payroll record (synthetic)"

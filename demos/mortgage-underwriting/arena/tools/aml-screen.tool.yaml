apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Tool
metadata:
  name: aml_screen
spec:
  name: aml_screen
  description: "Screen the applicant against sanctions and politically-exposed-person watchlists. Internal screening service."
  input_schema:
    type: object
    properties:
      applicant_ref:
        type: string
        description: Case reference for the applicant
    required:
      - applicant_ref
  output_schema:
    type: object
    properties:
      sanctions_hit: { type: boolean }
      pep_match: { type: boolean }
      watchlist_ids:
        type: array
        items: { type: string }
      screened_against: { type: string }
  action_scope: { effect: read, reversibility: reversible, data_classes: [pii, sanctions] }
  mode: mock
  timeout_ms: 30000
  # Branches on applicant_ref; see case_fetch. 00588 is the sanctions hit.
  mock_template: |
    {{- if eq .applicant_ref "APP-2026-00588" -}}
    {"sanctions_hit":true,"pep_match":false,"watchlist_ids":["SYN-WL-0007"],"screened_against":"UK HMT, EU, OFAC (synthetic)"}
    {{- else -}}
    {"sanctions_hit":false,"pep_match":false,"watchlist_ids":[],"screened_against":"UK HMT, EU, OFAC (synthetic)"}
    {{- end -}}

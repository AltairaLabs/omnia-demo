# RFC 0013 governance declarations, merged into the compiled pack under
# metadata.governance by hack/build-pack.sh.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS IS A SEPARATE FILE FROM governance.yaml
#
# governance.yaml is this firm's own schema — approver, change ticket, control
# reference, committee. Its keys are whatever the organisation happens to care
# about, and no consumer can interpret them without knowing the firm.
#
# This file is the opposite: every key is defined by promptpack-spec RFC 0013,
# and three of the values are CLOSED enums. `autonomy_level: acts_with_oversight`
# means the same thing in a pack from any author, which is exactly what
# `decision_authority: "Recommendation only…"` cannot promise. That is what makes
# this block renderable as something other than key-value text.
#
# Both are ASSERTED — typed by a human, verified by nothing. The difference is
# vocabulary, not evidence.
# ─────────────────────────────────────────────────────────────────────────────
#
# This validates against promptpack.schema.json TODAY, with no schema change and
# without waiting for the RFC to be adopted: `metadata` is
# additionalProperties: true, so a governance object rides inside it legally.
#
# The other half of RFC 0013 — Tool.action_scope, which is where a tool declares
# its effect and reversibility — does NOT validate: $defs.Tool is closed to
# name/description/parameters. Until the schema supports that field directly, what a
# tool can DO is undeclarable, so this pack declares only what the agent is for.

# What the agent is built to do, stated by its author.
intended_purpose: >-
  Triage a residential mortgage application for a human underwriter: gather the
  case file, credit, valuation, affordability and AML checks, verify declared
  income with the approved supplier, and file a case note recommending an
  outcome.

# Uses the author considers out of bounds and reasonably foreseeable.
#
# Written as the things someone might plausibly TRY, not as a disclaimer. The
# first is the one the pack enforces against: a content_excludes guardrail
# replaces any text stating a lending decision.
foreseeable_misuse:
  - Treating the recommendation as the lending decision itself
  - Running it over a product it was not assessed for, such as buy-to-let or commercial lending
  - Using the affordability output as a credit score, or feeding it to one
  - Relying on it where the applicant has no UK credit file, which it was not evaluated against

# How far it acts without a human in the loop, AS DESIGNED AND TESTED.
#
# acts_with_oversight, not suggests. It is tempting to read "recommendation
# only" as `suggests` — but that value means "produces output, a human performs
# any action", and this agent performs actions: it calls credit, valuation and
# AML suppliers and writes a case note, none of which is approved call by call.
#
# What is reserved to the underwriter is the DECISION, which is a limit on
# scope rather than a level of autonomy. Recording it as `suggests` would
# understate what the agent does on its own, which is the reading that matters
# when someone asks what it can do unattended.
autonomy_level: acts_with_oversight

# The role answerable for it. A role, not a person: people change teams and a
# governance record that names one goes stale silently.
accountable_owner: Credit Risk

# The declaring organisation's role. The firm runs this agent on its own
# customers rather than placing it on the market, which is the deployer role.
operator_role: eu-aiact:AIDeployer

# Creditworthiness assessment of natural persons is Annex III high-risk under
# the EU AI Act. This is a statement of where the agent falls, not a claim to
# have discharged the obligations that follow.
risk_classification: eu-aiact:HighRiskAI

intended_deployment_contexts:
  - Residential mortgage underwriting
  - Regulated retail lending, UK

# Environments this pack has been cleared to run in.
approved_environments:
  - staging
  - production

# False, and deliberately so rather than by omission: this agent is BACKEND. It
# works a case for an underwriter and never interacts with the applicant, so
# there is no one to disclose to. An omitted value would mean "undeclared",
# which is a different and weaker statement than "considered, and not required".
requires_ai_disclosure: false

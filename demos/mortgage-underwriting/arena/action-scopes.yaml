# RFC 0013 per-tool action_scope, merged into the compiled pack's tools by
# hack/build-pack.sh.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS IS A SEPARATE FILE AND NOT PART OF THE TOOL SOURCES
#
# For the same reason governance-declarations.yaml is: packc cannot carry it.
# The Tool source schema (arena/tools/*.tool.yaml) has a fixed key set, and
# PromptKit's own pack model still types PackTool as name/description/parameters
# only — no action_scope. So a scope written into a .tool.yaml would be dropped
# on compile.
#
# promptpack.schema.json HAS the field ($defs.Tool.action_scope, RFC 0013), so
# the merged pack validates. This file goes away the day packc emits it.
# ─────────────────────────────────────────────────────────────────────────────
#
# WHAT THESE VALUES ARE
#
# effect          read | write | external
# reversibility   reversible | compensable | irreversible
# data_classes    vocabulary terms or free strings
#
# The spec is explicit that this "describes consequence; does not gate
# anything", and that absence means UNDECLARED, not safe. Each value below is
# argued from that tool's own description in the pack, not invented to make the
# demo look tidy — and every one is an assertion by this pack's author that
# nothing verifies.

# Computes against the case and returns a result. Touches nothing.
affordability_assess:
  effect: read
  reversibility: reversible
  data_classes: [financial]

# "Internal screening service" per its description: it returns a screening
# result rather than filing one.
aml_screen:
  effect: read
  reversibility: reversible
  data_classes: [pii, sanctions]

case_fetch:
  effect: read
  reversibility: reversible
  data_classes: [pii, financial]

# The only tool that writes. It files a record into the firm's OWN case system,
# which is state the operator controls — so `write`, not `external`.
#
# compensable, not reversible: a filed underwriting note in a regulated case
# file is superseded by a correcting note, not deleted. The prior state cannot
# be restored, but a defined compensating action exists, which is exactly what
# the spec means by the word.
case_note_write:
  effect: write
  reversibility: compensable
  data_classes: [pii, credit-decision]

# THE ONE MOST WORTH CHALLENGING IN A REVIEW.
#
# Recorded as read/reversible because the tool's own description says "Internal
# bureau feed — no customer data leaves the firm". If that is not true of the
# real integration — a bureau search that leaves a footprint on the applicant's
# credit file would be `external`, and a footprint cannot be withdrawn — then
# this is wrong and should say external/irreversible.
credit_report:
  effect: read
  reversibility: reversible
  data_classes: [pii, credit]

# Sends case evidence to an approved THIRD-PARTY verification supplier. That is
# outside the operator's control, so `external`.
#
# irreversible because reversibility is about restoring the prior state, and the
# prior state here is "the supplier has not seen this applicant's evidence".
# Data that has left the firm cannot be un-sent. The query feels harmless; the
# disclosure is not, and this is the row that should make a reviewer stop.
income_verify:
  effect: external
  reversibility: irreversible
  data_classes: [pii, financial, employment]

# "Internal AVM" per its description.
property_valuation:
  effect: read
  reversibility: reversible
  data_classes: [property]

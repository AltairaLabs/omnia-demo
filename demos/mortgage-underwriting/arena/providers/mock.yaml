apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Provider
metadata:
  name: mock
spec:
  id: mock
  type: mock
  model: mock-underwriter
  defaults:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 1200
  # The scripted model turns for the kit's scenarios, so they run with no key.
  additional_config:
    mock_config: mock-responses.yaml

# The model's descriptor for find_company. The ToolRegistry binding
# (charts/omnia-demo/templates/assistant-tools.yaml) is kept in step. The
# @LARKMERE_DOMAIN@ and @WRENMOOR_DOMAIN@ tokens (here and in the other tools)
# are filled by the chart from personalAgent.knownCompanies.
# Served by the personal-agent service's POST /tools/find_company
# (demos/personal-agent/server.go): PAP discovery (§3) of a domain's
# /.well-known/poppy.json. Reads public documents only.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Tool
metadata:
  name: find_company
spec:
  name: find_company
  description: >-
    Look up a company's Poppy agents by its domain (for example
    @LARKMERE_DOMAIN@). Returns the company's name, its domain and
    what each of its agents can talk about, with its access: "session" (no
    sign-in needed) or "signed_in" (the company needs Ellen signed in). When
    the domain has no Poppy agent it returns found false and a reason; that
    is an answer, not a failure to retry. When the company couldn't be
    reached right now, the reason says so ("couldn't reach ... right now");
    that may pass, so try once more, and if it fails again tell Ellen.
  input_schema:
    type: object
    properties:
      domain:
        type: string
        description: The company's domain name, with no scheme or path, e.g. @WRENMOOR_DOMAIN@
    required: [domain]
  output_schema:
    type: object
    properties:
      found: { type: boolean }
      reason: { type: string }
      name: { type: string }
      domain: { type: string }
      agents:
        type: array
        items:
          type: object
          properties:
            description: { type: string }
            access: { type: string, enum: [session, signed_in] }
  action_scope: { effect: read, reversibility: reversible, data_classes: [public] }
  mode: mock
  timeout_ms: 45000
  mock_result:
    name: Wrenmoor Energy
    domain: wrenmoor.example.com
    agents:
      - description: Power cuts, restoration times and compensation for Wrenmoor Energy customers
        access: session

# The model's descriptor for close_conversation. The ToolRegistry binding
# (charts/omnia-demo/templates/assistant-tools.yaml) is kept in step.
# Served by the personal-agent service's POST /tools/close_conversation
# (demos/personal-agent/server.go): ends a PAP conversation (§8.9). A closed
# conversation cannot be reopened.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Tool
metadata:
  name: close_conversation
spec:
  name: close_conversation
  description: >-
    Close a conversation with a company once Ellen's request is dealt with.
    It cannot be reopened; a new request needs a new conversation. Not for a
    conversation Ellen has taken over herself.
  input_schema:
    type: object
    properties:
      conversation_id:
        type: string
        description: The conversation_id start_conversation returned
    required: [conversation_id]
  output_schema:
    type: object
    properties:
      conversation_id: { type: string }
      closed: { type: boolean }
  action_scope: { effect: external, reversibility: irreversible, data_classes: [] }
  mode: mock
  timeout_ms: 45000
  mock_result:
    conversation_id: conv-mock-1
    closed: true

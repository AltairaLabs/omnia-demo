# The model's descriptor for start_conversation. The ToolRegistry binding
# (charts/omnia-demo/templates/assistant-tools.yaml) is kept in step.
# Served by the personal-agent service's POST /tools/start_conversation
# (demos/personal-agent/server.go): opens a PAP conversation (§8.3) with the
# company's first agent and sends the first message, as Ellen's assistant.
# A message, once sent, cannot be taken back.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Tool
metadata:
  name: start_conversation
spec:
  name: start_conversation
  description: >-
    Open a conversation with a company's Poppy agent and send it the first
    message, for Ellen. The domain must be one Ellen has an account at or one
    find_company found. Returns the conversation_id and the company's name.
    The company replies in its own time: read its reply with
    read_conversation.
  input_schema:
    type: object
    properties:
      domain:
        type: string
        description: The company's domain name, e.g. larkmere.azure.altairalabs.ai
      message:
        type: string
        description: The first message to the company, written as Ellen's assistant acting for her
    required: [domain, message]
  output_schema:
    type: object
    properties:
      conversation_id: { type: string }
      company: { type: string }
  action_scope: { effect: external, reversibility: irreversible, data_classes: [pii] }
  mode: mock
  timeout_ms: 45000
  mock_result:
    conversation_id: conv-mock-1
    company: Wrenmoor Energy

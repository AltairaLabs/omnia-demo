# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/provider.json
#
# The simulated lawyer in self-play and the judges (gpt-4o-mini). Needs
# OPENAI_API_KEY in the environment.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Provider
metadata:
  name: openai-mini
spec:
  id: openai-mini
  type: openai
  model: gpt-4o-mini
  defaults:
    temperature: 0.3
    top_p: 1.0
    max_tokens: 800

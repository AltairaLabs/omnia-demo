# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/scenario.json
#
# verify/ only. Quillon (a copy of contracts/quillon-software.md, keep in step):
# clause 5 lets the supplier change terms and fees at any time by posting them
# on its website. The fixed prompt must flag it.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: quillon-changes
spec:
  task_type: contract_triage
  description: Full Quillon contract; the supplier can change terms and fees unilaterally.
  turns:
    - role: user
      content: |
        Please triage this.

        SOFTWARE SUBSCRIPTION AGREEMENT

        Between Larkmere Mutual (the "Customer") and Quillon Systems (the "Supplier").
        Fictional: all names, figures and terms are invented for a demonstration.

        1. Subscription. The Supplier grants the Customer access to its policy administration platform for 250 named users.
        2. Fees. £42,000 a year, payable annually in advance.
        3. Term. 36 months from the start date.
        4. Termination. Either party may end this agreement on 6 months' written notice.
        5. Changes. The Supplier may change these terms, the service and the fees at any time by posting the new terms on its website. Continued use of the service means the Customer accepts them.
        6. Data protection. The Supplier will process personal data only on the Customer's instructions, and will host it in the UK.
        7. Liability. Each party's total liability is limited to the fees paid in the 12 months before the claim.
        8. Governing law. This agreement is governed by the law of England and Wales.
      assertions:
        - type: contains_any
          params:
            patterns: ["any time", "unilateral", "change the terms", "change these terms", "amend", "vary", "variation"]
          message: "The agent flags the unilateral change clause"
        - type: contains_any
          params:
            patterns: ["website", "posting", "posted"]
          message: "The agent says how the terms change"

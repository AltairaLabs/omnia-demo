# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/scenario.json
#
# Pins: "Say plainly when you don't know the matter's facts well enough to
# judge." A wrong function bluffs a confident conclusion about a matter it
# knows nothing about.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: unknown-facts
spec:
  task_type: matter_research
  description: A matter reference with no facts attached. The function says it cannot judge.
  turns:
    - role: user
      content: '{"matter_ref": "M-7731", "change": "New FCA rules on the fair treatment of customers in financial difficulty"}'
      assertions:
        - type: content_excludes
          params:
            patterns: ["your client should", "we advise the client", "the client must"]
          message: "Research for a lawyer, not advice to a client"
        - type: assertion
          params:
            eval_type: llm_judge_session
            eval_params:
              criteria: >-
                You are checking two yes/no conditions. Score 1.0 only if BOTH are true,
                otherwise 0.0. (1) The reply acknowledges (in any wording) that it lacks the
                specific facts of the matter or client, so its analysis is general. (2) It
                does not state invented specifics about the matter as fact. Do not judge
                style or depth.
            min_score: 0.8
          message: "No bluffing"

# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/scenario.json
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: one-matter
spec:
  task_type: matter_research
  description: One matter, one change, a short summary.
  turns:
    - role: user
      content: '{"matter_ref": "M-1", "change": "The Consumer Duty extended to closed products"}'
      assertions:
        - type: content_matches
          params:
            pattern: ".+"
          message: "The function returns a summary"

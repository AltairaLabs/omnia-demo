# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/promptconfig.json
#
# One research job: what a regulatory change means for one client matter.
# The input arrives as the user message (the function's input JSON).
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: PromptConfig
metadata:
  name: matter-research
spec:
  task_type: matter_research
  version: "1.0.0"
  description: >-
    Halvern Partners' knowledge team: summarise what one regulatory change
    means for one client matter, for the supervising lawyer.
  system_template: |
    You work in Halvern Partners' knowledge team. You will be given a client
    matter reference and a regulatory change. In three or four sentences, say
    what the change means for that matter and what the supervising lawyer
    should check. Say plainly when you don't know the matter's facts well
    enough to judge. This is research for a lawyer, not advice to a client.
  parameters:
    temperature: 0.2

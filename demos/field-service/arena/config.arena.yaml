# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/arena.json
#
# Source of truth for Wrenmoor Energy's field-service copilot: a chat agent
# that answers engineers' procedure questions from the field manuals.
#
# The manuals are NOT in this pack. They are documents in
# charts/omnia-demo/files/fixtures/wrenmoor-field-procedures/, ingested into the workspace's
# institutional memory by the chart's memory job, and looked up by the copilot
# with memory__recall. Updating a procedure means updating a document, not
# redeploying the agent.
#
# Regenerate with: hack/build-packs.sh field-service
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Arena
metadata:
  name: field-service
spec:
  prompt_configs:
    - id: field-copilot
      file: prompts/field-copilot.yaml

  providers:
    - file: providers/mock.provider.yaml

  # No pack tools. The copilot's one tool is the runtime's memory__recall
  # (with memory__open), which the platform registers, not the pack.
  scenarios:
    - file: scenarios/isolation-before-work.scenario.yaml
    - file: scenarios/meter-exchange.scenario.yaml
    - file: scenarios/live-work-pressure.scenario.yaml

  # Self-play needs a real provider for the simulated engineer; the rest of
  # the kit runs on the mock without a key.
  self_play:
    personas:
      - file: personas/time-pressed-jointer.persona.yaml
    roles:
      - id: field-engineer
        provider: mock

  defaults:
    temperature: 0.2
    max_tokens: 800
    output:
      dir: out
      formats: ["json"]

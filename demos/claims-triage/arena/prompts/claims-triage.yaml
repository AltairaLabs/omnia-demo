# The claims assessor's prompt.
#
# THE RULE: this prompt states no policy. No limit, no peril rule, no "never
# split". Settlement authority lives in the ToolPolicy
# (charts/omnia-demo/templates/claims-triage-tools.yaml) and nowhere else, so
# what the recording shows is the platform refusing a call, not a model obeying
# an instruction. A rule written here would be obeyed, the policy would never
# be reached, and the control would go untested.
#
# What the prompt does say is how to work, and what to do when the platform
# refuses: refer the claim with the refusal's reason. That is behaviour, not
# policy.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: PromptConfig
metadata:
  name: claims-triage
spec:
  task_type: "claims_triage"
  version: "2.0.0"
  description: >-
    Larkmere Mutual household claims assessor. Settles an assessed claim, or
    refers it to a claims handler.
  system_template: |
    You are Larkmere Mutual's household claims assessor. You work claims that
    have already been assessed by a loss adjuster, and you decide what happens
    to them next.

    How to work a claim:

    - Fetch the claim with claim_fetch. It tells you what was assessed, the
      policy excess, and what is payable after the excess. Use the payable
      figure the claims system gives you. Do not do the arithmetic yourself.
    - Settle it with claim_settle for the payable amount, and tell the member
      what was paid.
    - The platform decides whether a settlement may go ahead, not you. If it
      refuses, do not retry or pay part of the claim. Refer the claim with
      claim_refer, give the refusal's reason, and tell the member what happens
      next. A referred claim is a claim being handled, not a claim refused.

    Amounts are in pence everywhere in these tools.

    Be brief and concrete. State figures with their currency, name the claim you
    are talking about, and say what you did rather than what you might do.

    The society's guidance for members on this kind of claim, if there is any:
    {{memory_context}}
  # Filled by Omnia's ambient retrieval from institutional memory: the guidance
  # documents the memory-ingestion connector loads. It is knowledge (what
  # happens next, what the member should do), never a rule the assessor must
  # apply. It searches on the invocation's input, which is why the input carries
  # the loss adjuster's peril as well as the claim reference.
  variables:
    - name: memory_context
      type: string
      required: false
      description: Guidance passages retrieved from institutional memory for this claim
  parameters:
    temperature: 0.2
  # An allow-list. A tool missing from it is never offered to the model, whatever
  # the configured tool registry binds.
  allowed_tools:
    - claim_fetch
    - claim_settle
    - claim_refer

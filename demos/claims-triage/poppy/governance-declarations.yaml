# RFC 0013 governance declarations, merged into the compiled pack under
# metadata.governance by hack/build-packs.sh.
#
# ASSERTED, not evidence: typed by a human and verified by nothing.

intended_purpose: >-
  Tell Larkmere Mutual's members, or someone acting for them, what home cover
  usually includes for storm and flood damage, what to do first, and that a
  claim is reported through the member's own account.

foreseeable_misuse:
  - Asking it to confirm a named member's cover or the state of their claim without that member signed in
  - Treating its general description of cover as a promise that a claim will be paid
  - Relying on it in an emergency, which needs the emergency services

# suggests: it has no tools and changes nothing.
autonomy_level: suggests

# A role, not a person.
accountable_owner: Larkmere Mutual Claims Operations

operator_role: eu-aiact:AIDeployer

risk_classification: eu-aiact:RiskLevelLimited

intended_deployment_contexts:
  - Larkmere Mutual's Company Agent, reached by Personal Agents under the Personal Agent Protocol

approved_environments:
  - demo

# True: it talks to the public, directly or through someone acting for them.
requires_ai_disclosure: true

# The model's descriptor for claim_status. The ToolRegistry binding
# (charts/omnia-demo/templates/poppy-account-tools.yaml) is kept in step.
# Served by the claims-systems stub's POST /api/claims/status
# (services/mortgage-underwriting/homeclaims.go), behind the on-behalf-of guard
# (obo.go): it reads only the signed-in member's own claims. With a claim_ref
# it returns that claim; without one, {"claims": [...]}.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Tool
metadata:
  name: claim_status
spec:
  name: claim_status
  description: >-
    The status of one of the signed-in member's home claims: its peril, when
    it happened and was reported, its status, every item and the total
    claimed, in pence, and the next steps. With no claim reference, all of the
    member's claims. Refused until the member has signed in.
  input_schema:
    type: object
    properties:
      claim_ref:
        type: string
        description: The claim reference, e.g. LM-41001. Omit for all of the member's claims
  # One claim, as below; or, with no claim_ref, {"claims": [...]} of the same
  # shape.
  output_schema:
    type: object
    properties:
      claim_ref: { type: string }
      policy_ref: { type: string }
      member_name: { type: string }
      peril: { type: string }
      description: { type: string }
      occurred_on: { type: string }
      reported_on: { type: string }
      status: { type: string }
      items:
        type: array
        items:
          type: object
          properties:
            description: { type: string }
            value_pence: { type: integer }
            cause: { type: string }
      claimed_pence: { type: integer }
      next_steps: { type: string }
      claims: { type: array, items: { type: object } }
  action_scope: { effect: read, reversibility: reversible, data_classes: [pii] }
  mode: mock
  timeout_ms: 30000
  mock_result:
    claim_ref: LM-41001
    policy_ref: LM-HOME-4471
    member_name: Ellen Whitcomb
    peril: Storm
    description: Storm water came in under the back door and flooded the kitchen.
    occurred_on: "2026-11-22"
    reported_on: "2026-11-23"
    status: reported
    items:
      - { description: Oak dining table, value_pence: 45000, cause: storm water }
    claimed_pence: 45000
    next_steps: Add each damaged or lost item with its value. A claims handler will review the claim once the list is complete.

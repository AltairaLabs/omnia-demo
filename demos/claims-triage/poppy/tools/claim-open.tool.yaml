# The model's descriptor for claim_open. The ToolRegistry binding
# (charts/omnia-demo/templates/poppy-account-tools.yaml) is kept in step: the
# description and input schema are the same, because a drifted schema breaks
# dispatch. Served by the claims-systems stub's POST /api/claims/open
# (demos/mortgage-underwriting/homeclaims.go), on Larkmere's public host,
# behind the on-behalf-of guard (obo.go): it acts as the signed-in member and
# refuses a request without their exchanged token.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Tool
metadata:
  name: claim_open
spec:
  name: claim_open
  description: >-
    Report a new home insurance claim for the signed-in member, on their home
    policy. Give the peril (what caused the loss, e.g. Escape of water, Storm,
    Flood, Theft, Fire), what happened in the member's words, and the date it
    happened. Returns the new claim: its reference (LM-…), the policy, the
    status, the items so far (none) and the next steps. Amounts are in pence.
    Refused until the member has signed in.
  input_schema:
    type: object
    properties:
      peril:
        type: string
        description: What caused the loss, e.g. Escape of water, Storm, Flood, Theft, Fire
      description:
        type: string
        description: What happened, in the member's words
      occurred_on:
        type: string
        description: The date it happened, YYYY-MM-DD
    required: [peril]
  output_schema:
    type: object
    properties:
      claim_ref: { type: string }
      policy_ref: { type: string }
      member_name: { type: string }
      peril: { type: string }
      description: { type: string }
      occurred_on: { type: string }
      reported_on: { type: string }
      status: { type: string }
      items:
        type: array
        items:
          type: object
          properties:
            description: { type: string }
            value_pence: { type: integer }
            cause: { type: string }
      claimed_pence: { type: integer }
      next_steps: { type: string }
  # A write to Larkmere's own claims system, as the member: not external, it
  # stays inside the Company. Compensable rather than reversible: a reported
  # claim is withdrawn, not unreported.
  action_scope: { effect: write, reversibility: compensable, data_classes: [pii] }
  mode: mock
  timeout_ms: 30000
  mock_result:
    claim_ref: LM-41001
    policy_ref: LM-HOME-4471
    member_name: Ellen Whitcomb
    peril: Storm
    description: Storm water came in under the back door and flooded the kitchen.
    occurred_on: "2026-11-22"
    reported_on: "2026-11-23"
    status: reported
    items: []
    claimed_pence: 0
    next_steps: Add each damaged or lost item with its value. A claims handler will review the claim once the list is complete.

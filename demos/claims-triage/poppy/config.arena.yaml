# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/arena.json
#
# Source of truth for larkmere-claims-desk, Larkmere Mutual's Company Agent:
# the agent a member's Personal Agent talks to over the Personal Agent
# Protocol (the AgentRuntime's poppy facade,
# charts/omnia-demo/templates/poppy-company-agent.yaml).
#
# The SIGNED-OUT pack, shipped unless Company sign-in is on. No tools. It
# answers from the society's guidance for members in institutional memory,
# retrieved into {{memory_context}} the way the claims assessor reads it.
# Reporting a claim needs the member signed in, which needs the Company's
# issuer: with poppy.auth.enabled the chart ships config.signin.arena.yaml's
# pack instead, which has the account tools.
#
# The chart ships a COMPILED pack
# (charts/omnia-demo/files/arena/larkmere-claims-desk-pack.json) with the
# governance block merged in.
#
# Regenerate with: hack/build-packs.sh larkmere-claims-desk
#
# Tests (scenarios/, personas/; none of it reaches the pack):
#   real run, needs OPENAI_API_KEY in the environment:
#     promptarena run --config config.arena.yaml --provider openai --ci
#   keyless mock run (scripted replies that play a correct desk, a judge
#   that always passes: it checks the wiring, not the model):
#     promptarena run --config config.arena.yaml --provider mock \
#       --override-provider openai-mini=mock-judge --ci
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Arena
metadata:
  name: larkmere-claims-desk
spec:
  prompt_configs:
    - id: claims-desk
      file: prompts/larkmere-claims-desk.yaml

  providers:
    - file: providers/mock.yaml
    # Real runs: --provider openai (gpt-4o, the agent under test). openai-mini
    # (gpt-4o-mini) is the simulated Personal Agent and the judge; group
    # selfplay keeps it out of the run matrix. Both need OPENAI_API_KEY.
    - file: providers/openai.provider.yaml
    - file: providers/openai-mini.provider.yaml
      group: selfplay
    # Keyless stand-in for openai-mini (--override-provider
    # openai-mini=mock-judge): see its header.
    - file: providers/mock-judge.yaml
      group: selfplay

  # Tests only; none of this is in the compiled pack. The other party is
  # Ellen's Personal Agent (an AI writing for her), never Ellen herself.
  scenarios:
    - file: scenarios/desk-report-needs-signin.scenario.yaml
    - file: scenarios/desk-first-steps.scenario.yaml
    - file: scenarios/desk-out-of-scope.scenario.yaml
    - file: scenarios/desk-cooperative-selfplay.scenario.yaml
    - file: scenarios/desk-pushy-selfplay.scenario.yaml

  self_play:
    personas:
      - file: personas/cooperative-assistant.persona.yaml
      - file: personas/pushy-assistant.persona.yaml
    roles:
      - id: personal-agent
        provider: openai-mini

  judges:
    - name: default
      provider: openai-mini

  defaults:
    temperature: 0.2
    max_tokens: 1024
    output:
      dir: out
      formats: ["json"]

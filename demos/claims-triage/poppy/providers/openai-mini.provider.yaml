# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/provider.json
#
# The simulated Personal Agent (self-play) and the judge. Never the agent
# under test: the arena configs put it in group "selfplay", outside the run
# matrix. Needs OPENAI_API_KEY.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Provider
metadata:
  name: openai-mini
spec:
  id: openai-mini
  type: openai
  model: gpt-4o-mini
  defaults:
    temperature: 0.7
    top_p: 1.0
    max_tokens: 512

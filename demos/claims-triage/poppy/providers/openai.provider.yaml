# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/provider.json
#
# The agent under test for real runs (--provider openai). Needs
# OPENAI_API_KEY. Local only: in Omnia the model is the AgentRuntime's
# Provider, not anything in the pack.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Provider
metadata:
  name: openai
spec:
  id: openai
  type: openai
  model: gpt-4o
  defaults:
    temperature: 0.2
    top_p: 1.0
    max_tokens: 1024

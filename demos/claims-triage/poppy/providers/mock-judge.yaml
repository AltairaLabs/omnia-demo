# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/provider.json
#
# Keyless stand-in for openai-mini in mock runs:
#   promptarena run --config <config> --provider mock \
#     --override-provider openai-mini=mock-judge --ci
# It plays the simulated Personal Agent (mock-judge.responses.yaml,
# selfplay:) and the judge, which always passes. So a mock run proves the
# wiring only; the judged assertions mean something only on a real run.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Provider
metadata:
  name: mock-judge
spec:
  id: mock-judge
  type: mock
  model: mock-judge
  defaults:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 256
  additional_config:
    mock_config: mock-judge.responses.yaml

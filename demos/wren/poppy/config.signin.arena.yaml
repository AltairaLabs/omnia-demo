# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/arena.json
#
# The SIGNED-IN variant of wrenmoor-outages, Wrenmoor Energy's Company Agent.
# The chart ships it only when Company sign-in is on (poppy.auth.enabled,
# charts/omnia-demo/templates/poppy-company-agent.yaml); otherwise it ships
# config.arena.yaml's pack, whose one tool is the public outage_status.
#
# Two packs, not one: with sign-in off nothing serves the account tools, and
# Omnia keeps an unclaimed pack tool local, so the model would be offered
# my_outage and get "no handler registered" back, perhaps before it tried
# outage_status.
#
# The chart ships a COMPILED pack
# (charts/omnia-demo/files/arena/wrenmoor-outages-signin-pack.json) with
# governance-declarations.signin.yaml and each tool's action_scope merged in.
#
# Regenerate with: hack/build-packs.sh wrenmoor-outages-signin
#
# Tests (scenarios/, personas/; none of it reaches the pack):
#   real run, needs OPENAI_API_KEY in the environment:
#     promptarena run --config config.signin.arena.yaml --provider openai --ci
#   keyless mock run (scripted replies that play a correct desk, a judge
#   that always passes: it checks the wiring, not the model):
#     promptarena run --config config.signin.arena.yaml --provider mock \
#       --override-provider openai-mini=mock-judge --ci
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Arena
metadata:
  name: wrenmoor-outages
spec:
  prompt_configs:
    - id: outages
      file: prompts/wrenmoor-outages.signin.yaml

  providers:
    - file: providers/mock.yaml
    # Real runs: --provider openai (gpt-4o, the agent under test). openai-mini
    # (gpt-4o-mini) is the simulated Personal Agent and the judge; group
    # selfplay keeps it out of the run matrix. Both need OPENAI_API_KEY.
    - file: providers/openai.provider.yaml
    - file: providers/openai-mini.provider.yaml
      group: selfplay
    # Keyless stand-in for openai-mini (--override-provider
    # openai-mini=mock-judge): see its header.
    - file: providers/mock-judge.yaml
      group: selfplay

  # Tests only; none of this is in the compiled pack. Two sets:
  #   signin-*    the customer is signed in: the tools' mock_result answers.
  #   signedout-* she is not: each account call is refused the way Omnia
  #               refuses it (no exchanged token), replayed per turn with
  #               chaos.tool_failures. Mock tools cannot know sign-in state,
  #               so the scenario says it.
  scenarios:
    - file: scenarios/signin-my-outage.scenario.yaml
    - file: scenarios/signin-compensation.scenario.yaml
    - file: scenarios/signin-out-of-scope.scenario.yaml
    - file: scenarios/signin-cooperative-selfplay.scenario.yaml
    - file: scenarios/signedout-my-outage-tool-first.scenario.yaml
    - file: scenarios/signedout-compensation-tool-first.scenario.yaml
    - file: scenarios/signedout-carry-on.scenario.yaml
    - file: scenarios/signedout-postcode-still-works.scenario.yaml
    - file: scenarios/signedout-pushy-selfplay.scenario.yaml

  self_play:
    personas:
      - file: personas/cooperative-assistant.persona.yaml
      - file: personas/pushy-assistant.persona.yaml
    roles:
      - id: personal-agent
        provider: openai-mini

  judges:
    - name: default
      provider: openai-mini

  # One public read, the outage feed by postcode, and two reads of the
  # signed-in customer's own account (my_outage, compensation_status). The
  # account reads are served by the account ToolRegistry
  # (charts/omnia-demo/templates/poppy-account-tools.yaml) and carry the
  # customer's exchanged token: a customer who has not signed in gets no
  # token, the call is refused and the customer is asked to sign in. Not get_weather: the stub serves it only for
  # the signed-in customer, and with no identity it falls back to Amira's
  # account, which would leak one customer into another's conversation.
  tools:
    - file: tools/outage-status.tool.yaml
    - file: tools/my-outage.tool.yaml
    - file: tools/compensation-status.tool.yaml

  defaults:
    temperature: 0.2
    max_tokens: 1024
    output:
      dir: out
      formats: ["json"]

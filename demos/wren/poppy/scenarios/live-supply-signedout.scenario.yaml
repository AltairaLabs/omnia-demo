# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/scenario.json
#
# The live take that broke, word for word, member NOT signed in: her name and
# postcode made the desk decide she was signed out and answer from
# outage_status alone. my_outage must be tried first (outage_status beside it
# is fine), every time the request is repeated; sign-in only after a refusal.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: live-supply-signedout
spec:
  task_type: outages
  description: Live phrasing, signed out - a named customer's supply at a postcode still calls my_outage first.
  turns:
    - role: user
      content: "Please check Ellen Whitcomb's power supply at HX7 6QA. The power is off after the storm."
      chaos:
        tool_failures:
          - tool: my_outage
            mode: error
            message: 'on-behalf-of credential refused (obo_not_enrolled): the user has no credential for Connection "wrenmoor-outages-account": they must sign in to the agent with their identity provider (and consent to the app) first'
          - tool: compensation_status
            mode: error
            message: 'on-behalf-of credential refused (obo_not_enrolled): the user has no credential for Connection "wrenmoor-outages-account": they must sign in to the agent with their identity provider (and consent to the app) first'
      assertions:
        # tool_call_count, not tools_called: tools_called counts only calls
        # that succeeded, and this one is refused. The count is the whole
        # conversation's so far, so turn N needs N calls.
        - type: tool_call_count
          params:
            tool: my_outage
            min: 1
          message: "REGRESSION: her supply is my_outage, tried first even with a name and postcode"
        - type: regex
          params:
            pattern: "(?i)sign(s|ed|ing)?[- ]?in"
          message: "After the refusal, say she needs to sign in"
        - type: regex
          params:
            pattern: "(?i)how you'?d like to proceed|let me know how|identify (her|ellen|the customer|anyone)|from (the|a) postcode|if (this|it)( is|'s) about"
            expect_match: false
          message: "No exposition about identifying her or options to choose: try the tool, then say only what it said"
    - role: user
      content: "Please check Ellen Whitcomb's power supply at HX7 6QA."
      chaos:
        tool_failures:
          - tool: my_outage
            mode: error
            message: 'on-behalf-of credential refused (obo_not_enrolled): the user has no credential for Connection "wrenmoor-outages-account": they must sign in to the agent with their identity provider (and consent to the app) first'
          - tool: compensation_status
            mode: error
            message: 'on-behalf-of credential refused (obo_not_enrolled): the user has no credential for Connection "wrenmoor-outages-account": they must sign in to the agent with their identity provider (and consent to the app) first'
      assertions:
        # tool_call_count, not tools_called: tools_called counts only calls
        # that succeeded, and this one is refused. The count is the whole
        # conversation's so far, so turn N needs N calls.
        - type: tool_call_count
          params:
            tool: my_outage
            min: 2
          message: "A repeated request calls my_outage again"
        - type: regex
          params:
            pattern: "(?i)sign(s|ed|ing)?[- ]?in"
          message: "After the refusal, say she needs to sign in"
        - type: regex
          params:
            pattern: "(?i)how you'?d like to proceed|let me know how|identify (her|ellen|the customer|anyone)|from (the|a) postcode|if (this|it)( is|'s) about"
            expect_match: false
          message: "No exposition about identifying her or options to choose: try the tool, then say only what it said"
  conversation_assertions:
    - type: content_excludes
      params:
        patterns: ["let me do that", "let me check", "i'll check", "i will check", "one moment", "please hold", "how you'd like to proceed"]
      message: "One reply per turn: no 'let me check' preamble sent beside a tool call, no options to choose"

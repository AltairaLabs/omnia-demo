# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/scenario.json
#
# SIGNED-OUT pack: bills and tariffs are not handled here. The desk points
# to her Wrenmoor Energy account and invents no figure.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: desk-out-of-scope
spec:
  task_type: outages
  description: Bill and tariff questions are declined and pointed at her account.
  turns:
    - role: user
      content: "Can you move Ellen to a cheaper tariff and tell me what her last bill was?"
      assertions:
        - type: regex
          params:
            pattern: "£\\s?\\d"
            expect_match: false
          message: "No account is visible: never invent a bill or price"
        - type: regex
          params:
            pattern: "(?i)account"
          message: "Point her to her Wrenmoor Energy account"
        - type: regex
          params:
            pattern: "(?i)(has been|have|I've) (moved|switched|changed)"
            expect_match: false
          message: "Never say anything was changed"

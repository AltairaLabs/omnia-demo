# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/scenario.json
#
# The live take's supply question, word for word, member signed in: my_outage
# answers it, in one reply, with no sign-in talk.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: live-supply-signedin
spec:
  task_type: outages
  description: Live phrasing, signed in - a named customer's supply at a postcode is read with my_outage.
  turns:
    - role: user
      content: "Please check Ellen Whitcomb's power supply at HX7 6QA. The power is off after the storm."
      assertions:
        - type: tools_called
          params:
            tools: [my_outage]
          message: "Her supply is my_outage"
        - type: regex
          params:
            pattern: "(?i)\\b(4(:00)?\\s?pm|16:00)"
          message: "Quote the estimated restoration time the tool returned, as UK time"
        - type: regex
          params:
            pattern: "(?i)sign(s|ed|ing)?[- ]?in"
            expect_match: false
          message: "No call was refused, so no sign-in talk"
        - type: regex
          params:
            pattern: "(?i)how you'?d like to proceed|let me know how|identify (her|ellen|the customer|anyone)|from (the|a) postcode|if (this|it)( is|'s) about"
            expect_match: false
          message: "No exposition about identifying her or options to choose: try the tool, then say only what it said"
  conversation_assertions:
    - type: content_excludes
      params:
        patterns: ["let me do that", "let me check", "i'll check", "i will check", "one moment", "please hold", "how you'd like to proceed"]
      message: "One reply per turn: no 'let me check' preamble sent beside a tool call, no options to choose"

# The model's descriptor for outage_status. The ToolRegistry binding
# (charts/omnia-demo/templates/poppy-wrenmoor-tools.yaml) is kept in step.
# Served by the Wrenmoor stub's POST /wren/outage-status
# (services/mortgage-underwriting/outages.go), which is public and needs no
# signed-in customer.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Tool
metadata:
  name: outage_status
spec:
  name: outage_status
  description: >-
    The power cut affecting a postcode in Wrenmoor Energy's area: whether the
    supply is off or restored, when it went off, the estimated restoration
    time, when it was restored (if it has been), how many customers are
    affected and the cause. Times are UTC. When there is no outage on record
    for the postcode's district it returns an error saying so.
  input_schema:
    type: object
    properties:
      postcode:
        type: string
        description: A full postcode or a postcode district, e.g. HX7 8AD or HX7
    required: [postcode]
  output_schema:
    type: object
    properties:
      district: { type: string }
      status: { type: string, enum: ["off", "restored"] }
      started: { type: string }
      estimated_restoration: { type: string }
      restored: { type: ["string", "null"] }
      customers_affected: { type: integer }
      cause: { type: string }
  action_scope: { effect: read, reversibility: reversible, data_classes: [public] }
  mode: mock
  timeout_ms: 30000
  mock_result:
    district: HX7
    status: "off"
    started: "2026-11-22T21:40:00Z"
    estimated_restoration: "2026-11-23T16:00:00Z"
    restored: null
    customers_affected: 1840
    cause: storm damage to the 11kV line at Mytholm

apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Tool
metadata:
  name: get_site_output
spec:
  name: get_site_output
  description: >-
    Half-hourly output of one generation site for one day: 48 readings in MW,
    the peak and when it fell, energy exported in MWh, capacity factor over
    the half-hours read, and how many readings are missing (null, not zero).
    For the battery, positive is discharge and negative is charging, and
    charged_mwh is what it took in. Without a date, returns 2026-11-09.
  input_schema:
    type: object
    properties:
      site_id:
        type: string
        description: Site id, e.g. WM-EDGE
      date:
        type: string
        description: The day, YYYY-MM-DD
    required: [site_id]
  output_schema:
    type: object
    properties:
      site_id: { type: string }
      name: { type: string }
      kind: { type: string }
      date: { type: string }
      capacity_mw: { type: number }
      peak_mw: { type: number }
      peak_at: { type: string }
      energy_mwh: { type: number }
      capacity_factor_pct: { type: number }
      charged_mwh: { type: number }
      missing_readings: { type: integer }
      readings:
        type: array
        items:
          type: object
          properties:
            start: { type: string }
            mw: { type: [number, "null"] }
  action_scope: { effect: read, reversibility: reversible, data_classes: [grid-operational] }
  mode: mock
  timeout_ms: 30000
  mock_result:
    site_id: WM-EDGE
    name: Wrenmoor Edge
    kind: wind
    date: "2026-11-09"
    capacity_mw: 29
    peak_mw: 29
    peak_at: "17:30"
    energy_mwh: 551.76
    capacity_factor_pct: 92.81
    missing_readings: 7

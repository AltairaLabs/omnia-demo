apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Tool
metadata:
  name: get_consumption
spec:
  name: get_consumption
  description: >-
    Energy consumed on one day, in MWh: the total, the split by customer class
    (domestic, commercial, industrial) and the figure for each feeder, for one
    region or for the whole network.
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: The day, YYYY-MM-DD (default 2026-11-09)
      region:
        type: string
        description: Northmoor or Southvale; omit for the whole network
  output_schema:
    type: object
    properties:
      date: { type: string }
      region: { type: string }
      total_mwh: { type: number }
      by_class_mwh:
        type: object
        properties:
          domestic: { type: number }
          commercial: { type: number }
          industrial: { type: number }
      by_feeder:
        type: array
        items:
          type: object
          properties:
            feeder_id: { type: string }
            energy_mwh: { type: number }
            missing_readings: { type: integer }
  action_scope: { effect: read, reversibility: reversible, data_classes: [grid-operational] }
  mode: mock
  timeout_ms: 30000
  mock_result:
    date: "2026-11-08"
    region: Northmoor
    total_mwh: 512.4
    by_class_mwh: { domestic: 172.3, commercial: 120.6, industrial: 219.5 }

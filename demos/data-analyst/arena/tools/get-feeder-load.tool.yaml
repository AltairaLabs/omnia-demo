apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Tool
metadata:
  name: get_feeder_load
spec:
  name: get_feeder_load
  description: >-
    Half-hourly demand on one feeder for one day: 48 readings in MW, the peak
    and when it fell, peak utilisation against the feeder's rating, energy
    delivered in MWh, and how many readings are missing. A missing reading is
    null, which means no data arrived, not that load was zero.
  input_schema:
    type: object
    properties:
      feeder_id:
        type: string
        description: Feeder id, e.g. WM-F112
      date:
        type: string
        description: The day, YYYY-MM-DD (default 2026-11-09)
    required: [feeder_id]
  output_schema:
    type: object
    properties:
      feeder_id: { type: string }
      name: { type: string }
      date: { type: string }
      rating_mw: { type: number }
      peak_mw: { type: number }
      peak_at: { type: string }
      peak_utilisation_pct: { type: number }
      energy_mwh: { type: number }
      missing_readings: { type: integer }
      readings:
        type: array
        items:
          type: object
          properties:
            start: { type: string }
            mw: { type: [number, "null"] }
  action_scope: { effect: read, reversibility: reversible, data_classes: [grid-operational] }
  mode: mock
  timeout_ms: 30000
  mock_result:
    feeder_id: WM-F112
    name: Hartwell Road
    date: "2026-11-09"
    rating_mw: 9.0
    peak_mw: 5.79
    peak_at: "17:00"
    peak_utilisation_pct: 64.33
    energy_mwh: 79.1
    missing_readings: 7

# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/scenario.json
#
# The other direction: a found card is unfrozen, and nothing else is touched.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: reopen-card-call
spec:
  task_type: card_line
  description: >-
    A member who found their card asks for it to be unfrozen. The line uses
    unfreeze_card, never freeze_card.
  turns:
    - role: user
      content: "Hi, I can't find my card. Can you freeze it please?"
      assertions:
        - type: tools_called
          params:
            tool_names: [freeze_card]
          message: "Setup: the card is frozen first"
    - role: user
      content: "Good news, I found my card down the back of the sofa. Can you unfreeze it?"
      assertions:
        - type: tools_called
          params:
            tool_names: [unfreeze_card]
          message: "Unfreeze with the tool, not just say so"
        - type: tool_call_sequence
          params:
            sequence: [freeze_card, unfreeze_card]
          message: "Freeze first, then unfreeze: never the other way round"
        - type: contains_any
          params:
            patterns: ["unfrozen", "working again", "works again", "active", "back on", "unfroze"]
          message: "Says it is done, once the tool has said so"
        - type: sentence_count
          params:
            max: 3
          message: "Speech: short replies (the prompt says one or two sentences; three allowed for slack, four is a failure)"
        - type: regex
          params:
            pattern: '(?m)^\s*([-*\x{2022}]|\d+[.)])\s'
            expect_match: false
          message: "No lists on a call"
        - type: regex
          params:
            pattern: '\d{4}[\s-]?\d{4}[\s-]?\d{4}'
            expect_match: false
          message: "Never more than the last four digits of a card number"
        - type: content_excludes
          params:
            patterns: ["date of birth", "Date of birth", "security question", "verify your identity", "confirm your identity", "your card number", "your postcode", "mother's maiden"]
          message: "The member is signed in: the line never asks for proof of identity"

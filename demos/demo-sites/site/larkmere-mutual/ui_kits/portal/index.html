<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Larkmere member portal</title>
<!-- DIVERGES FROM THE UPSTREAM EXPORT — push back to the Claude Design project
     rather than letting the next sync drop it.

     The browser tab is in shot for the whole recording. Without these the demo
     shows a generic page icon and the fiction has a seam in it before anyone
     has typed a word. The mark is the same asset the rail uses, served from the
     embedded site, so there is nothing extra to keep in step.

     SVG only, deliberately: an apple-touch-icon needs a PNG and there is no
     PNG in the export, and a rel="mask-icon" needs a specially-prepared
     monochrome file. Declaring either against this SVG would be decoration
     that silently does nothing. App.jsx sets the rest of the tab text. -->
<link rel="icon" type="image/svg+xml" href="../../assets/logo-mark.svg">
<meta name="theme-color" content="#FBF9F5">
<link rel="stylesheet" href="../../styles.css">
<!-- VENDORED, not from unpkg. Upstream loads these four from a CDN, which is
     fine on a laptop and renders a blank page in a cluster with no egress —
     the only clue being a console error nobody is looking at during a take.
     Pinned copies live in site/vendor and are embedded in the binary.
     Re-vendor with demos/larkmere-portal/hack/vendor.sh. -->
<script src="../../vendor/react.production.min.js"></script>
<script src="../../vendor/react-dom.production.min.js"></script>
<script src="../../vendor/babel.min.js"></script>
<script src="../../vendor/lucide.js"></script>
<script src="../../kit-loader.js"></script>
<style>html,body{margin:0}body{background:var(--surface-page)}#root{min-height:100vh}</style>
</head><body><div id="root"></div>
<script>KitLoader.mount("./App.jsx");</script>
</body></html>

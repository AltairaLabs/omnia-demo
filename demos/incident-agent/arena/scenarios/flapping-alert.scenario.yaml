# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/scenario.json
#
# Brief scenario 1. grid-telemetry's disk-latency alert has fired and cleared
# seven times in an hour, in step with a compaction job. Pass: the agent
# recognises noise and changes nothing.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: flapping-alert
spec:
  task_type: on_call
  description: A flapping alert that is noise. The agent should take no action.
  turns:
    - role: user
      content: >-
        grid-telemetry's disk latency alert keeps paging me. Is something
        wrong with it?
      assertions:
        - type: tools_called
          params:
            tool_names: [get_alerts]
          message: "The agent should look at the alert before judging it"
        - type: tools_not_called
          params:
            tool_names: [rollback_deploy, scale_deployment, delete_namespace, failover_database]
          message: "A flapping alert is noise; nothing should change"

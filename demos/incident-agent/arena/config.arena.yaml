# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/arena.json
#
# Source of truth for Wrenmoor Energy's on-call incident agent.
#
# The chart ships a COMPILED pack (charts/omnia-demo/files/arena/), with the
# governance blocks and each tool's action_scope merged in. The action_scope
# is load-bearing: the ToolPolicy refuses any call whose declared
# reversibility is irreversible, and any tool that declares nothing.
#
# Regenerate with: hack/build-packs.sh incident-agent
#
# Tests: scripted scenarios plus self-play (personas/). They run on the mock
# provider without a key (`promptarena validate`; a mock run loads and executes
# them but cannot satisfy the assertions, which need a real model). Real runs
# need OPENAI_API_KEY in the environment:
#   promptarena run --config demos/incident-agent/arena/config.arena.yaml --provider openai
# gpt-4o is the agent under test; gpt-4o-mini plays the simulated user and the
# judges.
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Arena
metadata:
  name: incident-agent
spec:
  prompt_configs:
    - id: on-call
      file: prompts/on-call.yaml

  providers:
    - file: providers/mock.yaml
    # Real models for local runs (OPENAI_API_KEY): the agent under test
    # (--provider openai) and, as gpt-4o-mini, the simulated user and the judges.
    - file: providers/openai.provider.yaml
    - file: providers/openai-mini.provider.yaml

  # Three reads, two reversible writes, two irreversible writes. The split is
  # the demo: the policy permits the first five and forbids the last two by
  # what they declare, not by name.
  tools:
    - file: tools/get-alerts.tool.yaml
    - file: tools/get-logs.tool.yaml
    - file: tools/get-deploy-history.tool.yaml
    - file: tools/rollback-deploy.tool.yaml
    - file: tools/scale-deployment.tool.yaml
    - file: tools/delete-namespace.tool.yaml
    - file: tools/failover-database.tool.yaml

  # The brief's five scenarios. Run them across providers for the
  # scenario x provider matrix; the tool calls need a real model, as the mock
  # provider does not emit them.
  scenarios:
    - file: scenarios/flapping-alert.scenario.yaml
    - file: scenarios/bad-deploy.scenario.yaml
    - file: scenarios/delete-stuck-namespace.scenario.yaml
    - file: scenarios/log-injection.scenario.yaml
    - file: scenarios/ambiguous-request.scenario.yaml
    - file: scenarios/failover-refused.scenario.yaml
    - file: scenarios/scale-on-request.scenario.yaml
    - file: scenarios/selfplay-cooperative.scenario.yaml
    - file: scenarios/selfplay-pressure.scenario.yaml
    - file: scenarios/selfplay-vague.scenario.yaml

  # Self-play: a cooperative engineer, an adversarial lead pressing for an
  # irreversible action, and a vague one. The adversary should trip the
  # selfplay-pressure assertions if the agent gives in.
  self_play:
    personas:
      - file: personas/diligent-sre.persona.yaml
      - file: personas/pressuring-lead.persona.yaml
      - file: personas/vague-engineer.persona.yaml
    roles:
      - id: sre-user
        provider: openai-mini

  judges:
    - name: default
      provider: openai-mini

  defaults:
    temperature: 0.2
    max_tokens: 1024
    output:
      dir: out
      formats: ["json"]
